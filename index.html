<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Between Tongues — AR</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; }
    #camera {
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; z-index:0;
    }
    #ar-canvas {
      position:fixed; inset:0; width:100%; height:100%; z-index:1;
    }
    #ui {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,0.93); color:white; font-family:monospace;
      z-index:10; text-align:center; padding:48px; gap:10px;
    }
    #ui .lang { font-size:11px; color:#555; letter-spacing:0.2em; }
    #ui h1 { font-size:15px; letter-spacing:0.06em; font-weight:normal; color:#eee; }
    #ui p { font-size:11px; color:#666; line-height:1.9; margin-top:4px; }
    #enter {
      margin-top:28px; padding:13px 36px;
      background:#E8503A; color:#fff; border:none;
      font-family:monospace; font-size:11px;
      letter-spacing:0.18em; text-transform:uppercase; cursor:pointer;
    }
    #hint {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      font-family:monospace; font-size:9px; color:rgba(255,255,255,0.25);
      letter-spacing:0.15em; text-transform:uppercase;
      z-index:5; pointer-events:none; white-space:nowrap;
    }
  </style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="ar-canvas"></canvas>
<div id="ui">
  <div class="lang">谁在说话 · Who's Speaking? · C'est qui?</div>
  <h1>Between Tongues</h1>
  <p>Turn your body slowly.<br>Language floats all around you.</p>
  <button id="enter" onclick="startAR()">Enter ↗</button>
</div>
<div id="hint">turn slowly to explore ↻</div>
<script>
const ASSETS = [
  'toronto.png','WO.png','BAI.png','beijing.png',
  'blue-bubble.png','blue-strip.png','BU.png',
  'bubbleCN1.png','bubbleEN1.png','bubbleFR1.png',
  'chinese-strip.png','english-strip.png','face3.png',
  'green-bubble.png','igotit.png','jsuis-perdu.png',
  'MING.png','montreal.png','red-bubble.png','SOS3.png'
];

const COUNT    = 50;
const MIN_DIST = 200;
const MAX_DIST = 700;
const BASE_SIZE= 180;
const FOV      = 500;
const BOB_SPD  = 0.0006;
const BOB_AMT  = 18;

let canvas, ctx, imgs=[], particles=[], yaw=0, pitch=0, t=0, lastAlpha=null;

async function startAR() {
  document.getElementById('ui').style.display='none';
  canvas=document.getElementById('ar-canvas');
  ctx=canvas.getContext('2d');
  onResize();
  window.addEventListener('resize', onResize);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}}, audio:false
    });
    document.getElementById('camera').srcObject=stream;
  } catch(e) {
    document.getElementById('camera').style.display='none';
  }

  // gyro requested inside button tap — iOS needs this
  await requestGyro();

  imgs = (await Promise.all(ASSETS.map(name=>new Promise(res=>{
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>res(null);
    img.src='./assets/'+name;
  })))).filter(Boolean);

  spawnParticles();
  requestAnimationFrame(loop);
}

function requestGyro() {
  return new Promise(resolve=>{
    if(typeof DeviceOrientationEvent==='undefined'){resolve();return;}
    const attach=()=>{
      window.addEventListener('deviceorientation', onOrientation);
      resolve();
    };
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission()
        .then(s=>{if(s==='granted')attach();else resolve();})
        .catch(()=>resolve());
    } else { attach(); }
  });
}

function onOrientation(e) {
  if(e.alpha===null) return;
  const a = e.alpha * Math.PI/180;
  if(lastAlpha!==null){
    let d=a-lastAlpha;
    if(d> Math.PI) d-=2*Math.PI;
    if(d<-Math.PI) d+=2*Math.PI;
    yaw-=d;
  }
  lastAlpha=a;
  pitch=((e.beta||0)-90)*Math.PI/180*0.35;
}

function spawnParticles() {
  particles=[];
  for(let i=0;i<COUNT;i++){
    const theta=Math.random()*Math.PI*2;
    const phi=(Math.random()-0.5)*Math.PI*0.85;
    const dist=MIN_DIST+Math.random()*(MAX_DIST-MIN_DIST);
    const x=dist*Math.cos(phi)*Math.sin(theta);
    const y=dist*Math.sin(phi);
    const z=dist*Math.cos(phi)*Math.cos(theta);
    const img=imgs.length ? imgs[i%imgs.length] : null;
    const ratio=img ? img.naturalHeight/img.naturalWidth : 0.75;
    const w=BASE_SIZE*(0.5+Math.random()*1.0);
    particles.push({
      img, w, h:w*ratio, x, y, z,
      bobPhase:Math.random()*Math.PI*2,
      bobY:Math.random()<0.7,
      tilt:(Math.random()-0.5)*0.3,
    });
  }
}

function onResize(){
  if(!canvas)return;
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

function loop(){
  t++;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const cx=canvas.width/2, cy=canvas.height/2;
  const cosY=Math.cos(yaw), sinY=Math.sin(yaw);
  const cosP=Math.cos(pitch), sinP=Math.sin(pitch);

  const proj=particles.map(p=>{
    const bob=Math.sin(t*BOB_SPD*2*Math.PI+p.bobPhase)*BOB_AMT;
    const wx=p.x+(p.bobY?0:bob*0.3);
    const wy=p.y+(p.bobY?bob:0);
    const wz=p.z;
    // yaw rotation
    const rx= wx*cosY+wz*sinY;
    const ry1=wy;
    const rz1=-wx*sinY+wz*cosY;
    // pitch rotation
    const ry= ry1*cosP-rz1*sinP;
    const rz= ry1*sinP+rz1*cosP;
    const depth=rz+MAX_DIST;
    if(depth<50)return null;
    const scale=FOV/depth;
    const sx=cx+rx*scale;
    const sy=cy-ry*scale;
    const normDist=(Math.sqrt(wx*wx+wy*wy+wz*wz)-MIN_DIST)/(MAX_DIST-MIN_DIST);
    const alpha=Math.max(0.15, 0.95-normDist*0.5);
    return{...p,sx,sy,scale,rz,alpha};
  }).filter(Boolean).sort((a,b)=>b.rz-a.rz);

  proj.forEach(p=>{
    const w=p.w*p.scale, h=p.h*p.scale;
    if(w<8)return;
    ctx.save();
    ctx.globalAlpha=p.alpha;
    ctx.translate(p.sx,p.sy);
    ctx.rotate(p.tilt);
    if(p.img) ctx.drawImage(p.img,-w/2,-h/2,w,h);
    ctx.restore();
  });
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
