<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Between Tongues</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; }
#cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
#c   { position:fixed; inset:0; width:100%; height:100%; z-index:1; }
#ui  {
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.92); color:#fff; font-family:monospace;
  text-align:center; padding:40px; gap:12px;
}
#ui h1 { font-size:16px; font-weight:normal; letter-spacing:0.05em; }
#ui p  { font-size:11px; color:#666; line-height:1.8; }
#ui button {
  margin-top:20px; padding:13px 40px; background:#E8503A;
  color:#fff; border:none; font-family:monospace;
  font-size:11px; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer;
}
#dbg {
  position:fixed; top:8px; left:8px; z-index:30;
  font-family:monospace; font-size:10px; color:yellow;
  pointer-events:none; line-height:1.5; display:none;
}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div id="ui">
  <div style="font-size:10px;color:#444;letter-spacing:0.2em">谁在说话 · Who's Speaking? · C'est qui?</div>
  <h1>Between Tongues</h1>
  <p>Hold your phone up and turn your body.<br>Language floats in the space around you.</p>
  <button onclick="begin()">Enter ↗</button>
</div>
<div id="dbg"></div>

<script>
// ─── ALL ASSETS ─────────────────────────────────────────
const ASSETS = [
  'toronto.png','WO.png','BAI.png','beijing.png',
  'blue-bubble.png','blue-strip.png','BU.png',
  'bubbleCN1.png','bubbleEN1.png','bubbleFR1.png',
  'chinese-strip.png','english-strip.png','face3.png',
  'green-bubble.png','igotit.png','jsuis-perdu.png',
  'MING.png','montreal.png','red-bubble.png','SOS3.png'
];

// ─── SETTINGS ───────────────────────────────────────────
const N_PARTICLES = 50;
const WORLD_R     = 900;   // world radius in px — how far out elements are placed
const HFOV        = 70;    // horizontal field of view in degrees
const BASE_SIZE   = 160;   // element size at WORLD_R distance
const BOB_HZ      = 0.18;  // bobs per second (slow breath)
const BOB_PX      = 20;    // bob amplitude in world px

// ─── STATE ──────────────────────────────────────────────
let canvas, ctx, W, H;
let imgs = [];
let particles = [];

// gyro: track absolute yaw in radians
// camYaw = how far the viewer has turned from their starting direction
let camYaw   = 0;
let camPitch = 0;
let gyroRef  = null;   // alpha value when experience started
let gyroActive = false;

let lastTS = 0;
let totalTime = 0;

// ─── BEGIN ──────────────────────────────────────────────
async function begin() {
  document.getElementById('ui').style.display = 'none';
  // document.getElementById('dbg').style.display = 'block'; // uncomment to debug

  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  resize();
  window.addEventListener('resize', resize);

  // camera
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ideal:'environment'} }, audio: false
    });
    document.getElementById('cam').srcObject = s;
  } catch(e) {}

  // GYRO — must be inside user gesture (button tap)
  await startGyro();

  // load images
  const loaded = await Promise.all(ASSETS.map(n => loadImg('./assets/' + n)));
  imgs = loaded.filter(Boolean);

  scatter();
  requestAnimationFrame(frame);
}

function loadImg(src) {
  return new Promise(res => {
    const i = new Image();
    i.onload  = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });
}

// ─── GYRO ───────────────────────────────────────────────
function startGyro() {
  return new Promise(resolve => {
    if (!window.DeviceOrientationEvent) { resolve(); return; }

    const attach = () => {
      window.addEventListener('deviceorientation', onGyro, true);
      gyroActive = true;
      resolve();
    };

    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(r => { if (r === 'granted') attach(); else resolve(); })
        .catch(() => resolve());
    } else {
      attach();
    }
  });
}

function onGyro(e) {
  const alpha = e.alpha; // 0-360, compass heading
  const beta  = e.beta;  // device tilt -180..180

  if (alpha == null) return;

  // first event: record reference direction
  if (gyroRef === null) {
    gyroRef = alpha;
  }

  // absolute yaw from start: how many degrees have we turned?
  let d = alpha - gyroRef;
  if (d >  180) d -= 360;
  if (d < -180) d += 360;

  // Turning RIGHT → alpha DECREASES on iOS (compass bearing goes down)
  // So we negate to make rightward turn = positive camYaw
  camYaw = d * Math.PI / 180;

  // pitch from beta: holding phone upright ≈ beta=90
  camPitch = (beta - 90) * Math.PI / 180 * 0.3;

  document.getElementById('dbg').textContent =
    `gyro ON\nalpha:${alpha.toFixed(1)} ref:${gyroRef.toFixed(1)}\nd:${d.toFixed(1)}° yaw:${(camYaw*180/Math.PI).toFixed(1)}°`;
}

// ─── SCATTER ────────────────────────────────────────────
function scatter() {
  particles = [];
  if (!imgs.length) return;

  for (let i = 0; i < N_PARTICLES; i++) {
    // random position in 3D sphere around viewer
    // theta = horizontal angle (0=forward, π=behind)
    // phi   = vertical angle  (0=horizon, ±π/2=up/down)
    const theta = Math.random() * Math.PI * 2;
    const phi   = (Math.random() - 0.5) * Math.PI * 0.75; // mostly near horizon

    // distance varies so some are close, some far
    const dist = WORLD_R * (0.45 + Math.random() * 0.85);

    // 3D world position (right-handed, Z forward)
    const wx = dist * Math.cos(phi) * Math.sin(theta);
    const wy = dist * Math.sin(phi);
    const wz = dist * Math.cos(phi) * Math.cos(theta);

    const img = imgs[i % imgs.length];
    const ratio = img.naturalHeight / img.naturalWidth;

    // intrinsic display size proportional to dist
    // (BASE_SIZE is how big it appears at exactly WORLD_R distance)
    const sVar = 0.6 + Math.random() * 0.8;
    const iw = BASE_SIZE * sVar;
    const ih = iw * ratio;

    particles.push({
      img, iw, ih,
      wx, wy, wz,
      bobPhase: Math.random() * Math.PI * 2,
      bobRate:  0.7 + Math.random() * 0.6,
      tilt:     (Math.random() - 0.5) * 0.3,
    });
  }
}

// ─── RESIZE ─────────────────────────────────────────────
function resize() {
  if (!canvas) return;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = W;
  canvas.height = H;
  if (ctx) {
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }
}

// ─── FRAME ──────────────────────────────────────────────
function frame(ts) {
  const dt = Math.min((ts - lastTS) / 1000, 0.05);
  lastTS = ts;
  totalTime += dt;

  ctx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2;

  // focal length from HFOV
  const fl = (W / 2) / Math.tan(HFOV * Math.PI / 360);

  // camera rotation matrices
  const cosY = Math.cos(camYaw),   sinY = Math.sin(camYaw);
  const cosP = Math.cos(camPitch), sinP = Math.sin(camPitch);

  // project each particle into camera space
  const visible = [];

  particles.forEach(p => {
    // world-space bob (smooth using totalTime)
    const bob = Math.sin(totalTime * BOB_HZ * p.bobRate * Math.PI * 2 + p.bobPhase) * BOB_PX;
    const wx = p.wx;
    const wy = p.wy + bob;
    const wz = p.wz;

    // 1) yaw rotation (around Y axis)
    const x1 =  wx * cosY + wz * sinY;
    const y1 =  wy;
    const z1 = -wx * sinY + wz * cosY;

    // 2) pitch rotation (around X axis)
    const x2 =  x1;
    const y2 =  y1 * cosP - z1 * sinP;
    const z2 =  y1 * sinP + z1 * cosP;

    // only draw things in front of camera
    if (z2 < 10) return;

    // perspective projection using focal length
    const scale = fl / z2;
    const sx = cx + x2 * scale;
    const sy = cy - y2 * scale;

    // screen-space size
    const sw = p.iw * scale;
    const sh = p.ih * scale;

    // cull if completely off screen
    if (sx + sw/2 < 0 || sx - sw/2 > W) return;
    if (sy + sh/2 < 0 || sy - sh/2 > H) return;

    // depth-based fade
    const normZ = z2 / (WORLD_R * 2);
    const alpha = Math.max(0.12, 0.95 - normZ * 0.7);

    visible.push({ p, sx, sy, sw, sh, z2, alpha });
  });

  // sort far to near
  visible.sort((a, b) => b.z2 - a.z2);

  visible.forEach(({ p, sx, sy, sw, sh, alpha }) => {
    if (sw < 8) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(sx, sy);
    ctx.rotate(p.tilt);
    ctx.drawImage(p.img, -sw/2, -sh/2, sw, sh);
    ctx.restore();
  });

  requestAnimationFrame(frame);
}
</script>
</body>
</html>
