<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Between Tongues — Three.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #cam {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    #three-wrap {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.92);
      color: #fff;
      font-family: monospace;
      text-align: center;
      padding: 48px;
      gap: 14px;
    }

    #ui .sub {
      font-size: 10px;
      color: #444;
      letter-spacing: 0.22em;
    }

    #ui h1 {
      font-size: 16px;
      font-weight: normal;
      letter-spacing: 0.04em;
    }

    #ui p {
      font-size: 11px;
      color: #666;
      line-height: 1.85;
      max-width: 340px;
    }

    #ui button {
      margin-top: 20px;
      padding: 13px 44px;
      background: #E8503A;
      color: #fff;
      border: none;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
    }

    #dbg {
      position: fixed;
      left: 8px;
      bottom: 8px;
      z-index: 30;
      color: rgba(255,255,255,0.56);
      font: 10px/1.5 monospace;
      background: rgba(0,0,0,0.30);
      padding: 6px 8px;
      white-space: pre-line;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <div id="three-wrap"></div>

  <div id="ui">
    <div class="sub">谁在说话 · Who's Speaking? · C'est qui?</div>
    <h1>Between Tongues</h1>
    <p>
      Language drifts through the space.<br>
      Feather-light, floating, turning.
    </p>
    <button id="enterBtn">Enter ↗</button>
  </div>

  <div id="dbg">waiting…</div>

  <script type="module">
    import * as THREE from 'three';

    const ASSETS = [
      'BAI.png','beijing.png','blue-bubble.png','BU.png',
      'bubbleCN1.png','bubbleCN2.png','bubbleCN3.png','bubbleCN4.png',
      'bubbleEN1.png','bubbleEN2.png','bubbleEN3.png','bubbleEN4.png','bubbleEN5.png',
      'bubbleFR1.png','bubbleFR2.png','bubbleFR3.png','bubbleFR4.png',
      'emoji.png','etalors.png','face3.png','green-bubble.png','igotit.png',
      'ithink.png','jsuis-perdu.png','LUANMA.png','maaybe.png','MING.png',
      'mini1.png','mini2.png','mini3.png','mini4.png','mini5.png','mini6.png',
      'mini7.png','mini8.png','mini9.png','mini10.png','mini11.png','mini12.png',
      'mini13.png','mini14.png','mini15.png','mini16.png','mini17.png',
      'montreal.png',
      'noise1.png','noise2.png','noise3.png','noise4.png','noise5.png','noise6.png',
      'noise7.png','noise8.png','noise9.png','noise10.png','noise11.png','noise12.png',
      'red-bubble.png','SOS3.png','toronto.png',
      'wiggleEN1.png','wiggleEN2.png','wiggleEN3.png','wiggleFR1.png','wiggleFR2.png',
      'WO.png','YANWENZI.png'
    ];

    const IMAGE_SCALE = {
      'BAI.png': 0.90,
      'beijing.png': 1.04,
      'blue-bubble.png': 0.96,
      'BU.png': 0.86,

      'bubbleCN1.png': 0.84, 'bubbleCN2.png': 0.84, 'bubbleCN3.png': 0.84, 'bubbleCN4.png': 0.84,
      'bubbleEN1.png': 0.84, 'bubbleEN2.png': 0.84, 'bubbleEN3.png': 0.84, 'bubbleEN4.png': 0.84, 'bubbleEN5.png': 0.84,
      'bubbleFR1.png': 0.84, 'bubbleFR2.png': 0.84, 'bubbleFR3.png': 0.84, 'bubbleFR4.png': 0.84,

      'emoji.png': 0.88,
      'etalors.png': 0.90,
      'face3.png': 0.98,
      'green-bubble.png': 0.96,
      'igotit.png': 0.86,
      'ithink.png': 0.88,
      'jsuis-perdu.png': 0.88,
      'LUANMA.png': 0.96,
      'maaybe.png': 0.88,
      'MING.png': 0.88,

      'mini1.png': 0.56, 'mini2.png': 0.56, 'mini3.png': 0.56, 'mini4.png': 0.56, 'mini5.png': 0.56,
      'mini6.png': 0.56, 'mini7.png': 0.56, 'mini8.png': 0.56, 'mini9.png': 0.56, 'mini10.png': 0.56,
      'mini11.png': 0.56, 'mini12.png': 0.56, 'mini13.png': 0.56, 'mini14.png': 0.56, 'mini15.png': 0.56,
      'mini16.png': 0.56, 'mini17.png': 0.56,

      'montreal.png': 1.00,

      'noise1.png': 0.60, 'noise2.png': 0.60, 'noise3.png': 0.60, 'noise4.png': 0.60,
      'noise5.png': 0.60, 'noise6.png': 0.60, 'noise7.png': 0.60, 'noise8.png': 0.60,
      'noise9.png': 0.60, 'noise10.png': 0.60, 'noise11.png': 0.60, 'noise12.png': 0.60,

      'red-bubble.png': 0.96,
      'SOS3.png': 0.88,
      'toronto.png': 1.00,

      'wiggleEN1.png': 0.74, 'wiggleEN2.png': 0.74, 'wiggleEN3.png': 0.74,
      'wiggleFR1.png': 0.74, 'wiggleFR2.png': 0.74,

      'WO.png': 0.88,
      'YANWENZI.png': 0.96
    };

    const CONFIG = {
      maxDpr: 1.5,
      fov: 42,
      near: 0.1,
      far: 60,
      cameraZ: 10,

      // 空间范围
      spreadX: 11,
      spreadY: 6.5,
      spreadZNear: -2,
      spreadZFar: -16,

      // 羽毛感运动
      driftHz: 0.23,
      driftX: 0.18,
      driftY: 0.14,
      driftZ: 0.22,

      flutterHz: 0.75,
      flutterY: 0.05,
      flutterRoll: 0.10,

      rotHz: 0.20,
      yawAmt: 0.65,
      pitchAmt: 0.40,
      rollAmt: 0.35,

      globalScale: 0.0052
    };

    const dbg = document.getElementById('dbg');
    const wrap = document.getElementById('three-wrap');
    const video = document.getElementById('cam');
    const enterBtn = document.getElementById('enterBtn');

    let renderer, scene, camera, clock;
    let cards = [];
    let started = false;

    function setDbg(text) {
      dbg.textContent = text;
    }

    async function start() {
      if (started) return;
      started = true;

      document.getElementById('ui').style.display = 'none';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        console.warn(err);
      }

      initThree();
      await buildScene();
      animate();
    }

    function initThree() {
      renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true,
        powerPreference: 'high-performance'
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x000000, 0);

      wrap.innerHTML = '';
      wrap.appendChild(renderer.domElement);

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        CONFIG.fov,
        window.innerWidth / window.innerHeight,
        CONFIG.near,
        CONFIG.far
      );
      camera.position.z = CONFIG.cameraZ;

      clock = new THREE.Clock();

      window.addEventListener('resize', onResize);
    }

    async function buildScene() {
      const loader = new THREE.TextureLoader();
      const maxAniso = renderer.capabilities.getMaxAnisotropy();

      const textures = await Promise.all(
        ASSETS.map(name => loadTexture(loader, `./assets/${name}`, name, maxAniso))
      );

      const loaded = textures.filter(Boolean);
      setDbg(`assets listed: ${ASSETS.length}\nloaded: ${loaded.length}\nmax anisotropy: ${maxAniso}`);

      for (const tex of loaded) {
        const name = tex.userData.srcName;
        const imgScale = IMAGE_SCALE[name] ?? 1;

        const img = tex.image;
        const aspect = img.width / img.height;

        const planeH = img.height * CONFIG.globalScale * imgScale;
        const planeW = planeH * aspect;

        const geo = new THREE.PlaneGeometry(planeW, planeH, 1, 1);

        const mat = new THREE.MeshBasicMaterial({
          map: tex,
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false
        });

        const mesh = new THREE.Mesh(geo, mat);

        mesh.position.set(
          THREE.MathUtils.randFloatSpread(CONFIG.spreadX),
          THREE.MathUtils.randFloatSpread(CONFIG.spreadY),
          THREE.MathUtils.randFloat(CONFIG.spreadZFar, CONFIG.spreadZNear)
        );

        mesh.rotation.set(
          THREE.MathUtils.randFloatSpread(0.8),
          THREE.MathUtils.randFloatSpread(1.2),
          THREE.MathUtils.randFloatSpread(0.8)
        );

        const baseOpacity = THREE.MathUtils.randFloat(0.42, 0.95);
        mat.opacity = baseOpacity;

        scene.add(mesh);

        cards.push({
          mesh,
          material: mat,
          baseOpacity,

          basePos: mesh.position.clone(),
          baseRot: mesh.rotation.clone(),

          driftPhaseX: Math.random() * Math.PI * 2,
          driftPhaseY: Math.random() * Math.PI * 2,
          driftPhaseZ: Math.random() * Math.PI * 2,

          rotPhaseX: Math.random() * Math.PI * 2,
          rotPhaseY: Math.random() * Math.PI * 2,
          rotPhaseZ: Math.random() * Math.PI * 2,

          flutterPhase: Math.random() * Math.PI * 2,

          driftRateX: 0.7 + Math.random() * 0.7,
          driftRateY: 0.7 + Math.random() * 0.7,
          driftRateZ: 0.7 + Math.random() * 0.7,

          rotRateX: 0.7 + Math.random() * 0.6,
          rotRateY: 0.7 + Math.random() * 0.6,
          rotRateZ: 0.7 + Math.random() * 0.6,

          flutterRate: 0.9 + Math.random() * 1.0
        });
      }
    }

    function loadTexture(loader, url, name, maxAniso) {
      return new Promise(resolve => {
        loader.load(
          url,
          (tex) => {
            tex.userData.srcName = name;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = Math.min(maxAniso, 8);
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.generateMipmaps = true;
            resolve(tex);
          },
          undefined,
          () => {
            console.warn('Failed to load', url);
            resolve(null);
          }
        );
      });
    }

    function onResize() {
      if (!renderer || !camera) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      for (const c of cards) {
        const m = c.mesh;

        // feather-like drift
        const dx = Math.sin(t * CONFIG.driftHz * c.driftRateX + c.driftPhaseX) * CONFIG.driftX;
        const dy = Math.cos(t * CONFIG.driftHz * c.driftRateY + c.driftPhaseY) * CONFIG.driftY;
        const dz = Math.sin(t * CONFIG.driftHz * c.driftRateZ + c.driftPhaseZ) * CONFIG.driftZ;

        // light flutter
        const flutterY = Math.sin(t * CONFIG.flutterHz * c.flutterRate + c.flutterPhase) * CONFIG.flutterY;
        const flutterRoll = Math.sin(t * CONFIG.flutterHz * c.flutterRate + c.flutterPhase) * CONFIG.flutterRoll;

        m.position.x = c.basePos.x + dx;
        m.position.y = c.basePos.y + dy + flutterY;
        m.position.z = c.basePos.z + dz;

        // free rotation in space
        m.rotation.x =
          c.baseRot.x +
          Math.sin(t * CONFIG.rotHz * c.rotRateX + c.rotPhaseX) * CONFIG.pitchAmt;

        m.rotation.y =
          c.baseRot.y +
          Math.sin(t * CONFIG.rotHz * c.rotRateY + c.rotPhaseY) * CONFIG.yawAmt;

        m.rotation.z =
          c.baseRot.z +
          Math.sin(t * CONFIG.rotHz * c.rotRateZ + c.rotPhaseZ) * CONFIG.rollAmt +
          flutterRoll;

        // depth fade
        const zNorm = THREE.MathUtils.clamp(
          (m.position.z - CONFIG.spreadZFar) / (CONFIG.spreadZNear - CONFIG.spreadZFar),
          0,
          1
        );
        c.material.opacity = THREE.MathUtils.lerp(0.18, c.baseOpacity, zNorm);
      }

      renderer.render(scene, camera);
    }

    enterBtn.addEventListener('click', start);
  </script>
</body>
</html>
