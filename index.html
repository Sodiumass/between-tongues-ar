<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Between Tongues</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; }
#cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
#c   { position:fixed; inset:0; width:100%; height:100%; z-index:1; touch-action:none; }
#ui, #permscreen {
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.93); color:#fff; font-family:monospace;
  text-align:center; padding:40px; gap:14px;
}
#ui h1, #permscreen h1 { font-size:16px; font-weight:normal; }
#ui p, #permscreen p { font-size:11px; color:#666; line-height:1.8; max-width:320px; }
.btn {
  margin-top:16px; padding:13px 40px; background:#E8503A;
  color:#fff; border:none; font-family:monospace;
  font-size:11px; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer;
}
#dbg {
  position:fixed; top:8px; left:8px; z-index:30;
  font-family:monospace; font-size:10px; color:yellow;
  line-height:1.5; background:rgba(0,0,0,0.5); padding:5px 8px;
  pointer-events:none; white-space:pre;
}
#permscreen { display:none; }
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="c"></canvas>

<!-- SCREEN 1: entry -->
<div id="ui">
  <div style="font-size:10px;color:#444;letter-spacing:0.2em">谁在说话 · Who's Speaking? · C'est qui?</div>
  <h1>Between Tongues</h1>
  <p>Hold your phone up.<br>Turn your body slowly.<br>Language floats all around you.</p>
  <button class="btn" onclick="goToPerm()">Enter ↗</button>
</div>

<!-- SCREEN 2: explicit gyro permission (iOS needs a fresh tap) -->
<div id="permscreen">
  <h1>Allow Motion Access</h1>
  <p>This experience uses your phone's gyroscope to let you look around the space.<br><br>Tap below to allow motion access.</p>
  <button class="btn" id="permbtn" onclick="grantAndStart()">Allow & Start</button>
</div>

<div id="dbg">loading…</div>

<script>
// ── FULL ASSET LIST ──────────────────────────────────────
const ASSETS = [
  'toronto.png','WO.png','BAI.png','beijing.png',
  'blue-bubble.png','blue-strip.png','BU.png',
  'bubbleCN1.png','bubbleEN1.png','bubbleFR1.png',
  'chinese-strip.png','english-strip.png','face3.png',
  'green-bubble.png','igotit.png','jsuis-perdu.png',
  'MING.png','montreal.png','red-bubble.png','SOS3.png'
];

// ── CONFIG ───────────────────────────────────────────────
const HFOV        = 65;
const N           = 50;
const MIN_DIST    = 500;
const MAX_DIST    = 1400;
const GLOBAL_SCALE= 0.45;   // overall image size
const BOB_HZ      = 0.22;   // bobs per second
const BOB_PX      = 22;     // float amplitude
const DRIFT_PX    = 18;     // gentle side drift

// ── STATE ────────────────────────────────────────────────
let canvas, ctx, W, H;
let imgs = [], particles = [];
let camYaw = 0, camPitch = 0;
let headingRef = null;
let gyroLive = false;
let isDrag = false, dragX = 0, dragY = 0;
let lastTS = 0, totalTime = 0;

// ── SCREEN FLOW ──────────────────────────────────────────
function goToPerm() {
  document.getElementById('ui').style.display = 'none';
  document.getElementById('permscreen').style.display = 'flex';
}

async function grantAndStart() {
  document.getElementById('permscreen').style.display = 'none';
  dbg('Starting…');

  // canvas
  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);

  // drag fallback
  canvas.addEventListener('pointerdown', e => { isDrag=true; dragX=e.clientX; dragY=e.clientY; });
  window.addEventListener('pointerup',   () => isDrag=false);
  window.addEventListener('pointermove', e => {
    if (!isDrag || gyroLive) return;
    camYaw   += (e.clientX - dragX) * 0.004;
    camPitch += (e.clientY - dragY) * 0.002;
    camPitch  = clamp(camPitch, -0.3, 0.3);
    dragX = e.clientX; dragY = e.clientY;
    dbg(`Drag mode\nYaw: ${deg(camYaw)}°`);
  });

  // camera
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ideal:'environment'} }, audio:false
    });
    document.getElementById('cam').srcObject = s;
  } catch(e) { dbg('Camera denied (ok, continuing)'); }

  // ── GYRO ── called right here inside the tap handler
  await setupGyro();

  // load images
  dbg('Loading images…');
  const loaded = await Promise.all(ASSETS.map(n => loadImg('./assets/'+n)));
  imgs = loaded.filter(Boolean);
  dbg(`Loaded ${imgs.length} images`);

  scatter();
  requestAnimationFrame(frame);
}

// ── GYRO SETUP ───────────────────────────────────────────
async function setupGyro() {
  if (!window.DeviceOrientationEvent) {
    dbg('No DeviceOrientationEvent'); return;
  }

  // iOS 13+ permission — this MUST be called synchronously inside a tap
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') { dbg('Motion permission denied'); return; }
      dbg('iOS permission granted ✓');
    } catch(e) { dbg('Permission error: '+e); return; }
  }

  window.addEventListener('deviceorientation', e => {
    // prefer webkitCompassHeading (absolute north-relative, iOS)
    // fall back to alpha (may drift)
    let heading;
    if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
      heading = e.webkitCompassHeading;
    } else if (typeof e.alpha === 'number' && !isNaN(e.alpha)) {
      heading = (360 - e.alpha) % 360;
    } else return;

    if (headingRef === null) headingRef = heading;

    let d = heading - headingRef;
    if (d >  180) d -= 360;
    if (d < -180) d += 360;

    camYaw   = d * Math.PI / 180;
    camPitch = clamp(((e.beta||90) - 90) * Math.PI/180 * 0.15, -0.3, 0.3);

    if (!gyroLive) { gyroLive = true; }
    dbg(`Gyro LIVE ✓\nYaw: ${deg(camYaw)}°\nHeading: ${heading.toFixed(1)}°`);
  }, true);
}

// ── SCATTER ──────────────────────────────────────────────
function scatter() {
  particles = [];
  for (let i = 0; i < N; i++) {
    const theta = (Math.random() - 0.5) * Math.PI * 1.9; // 342° spread
    const phi   = (Math.random() - 0.5) * Math.PI * 0.55;
    const dist  = MIN_DIST + Math.random() * (MAX_DIST - MIN_DIST);

    const wx = dist * Math.cos(phi) * Math.sin(theta);
    const wy = dist * Math.sin(phi);
    const wz = dist * Math.cos(phi) * Math.cos(theta);

    const img = imgs[i % imgs.length];
    const iw  = img.naturalWidth  * GLOBAL_SCALE;
    const ih  = img.naturalHeight * GLOBAL_SCALE;

    particles.push({
      img, iw, ih, wx, wy, wz,
      bobPhase : Math.random() * Math.PI * 2,
      bobRate  : 0.7 + Math.random() * 0.6,
      driftX   : (Math.random()-0.5) * DRIFT_PX,
      driftZ   : (Math.random()-0.5) * DRIFT_PX,
      driftRate: 0.3 + Math.random() * 0.5,
      tilt     : (Math.random()-0.5) * 0.18,
    });
  }
}

// ── RESIZE ───────────────────────────────────────────────
function resize() {
  if (!canvas) return;
  W = window.innerWidth; H = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  if (ctx) {
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }
}

// ── RENDER ───────────────────────────────────────────────
function frame(ts) {
  const dt = Math.min((ts - lastTS) / 1000, 0.05);
  lastTS = ts; totalTime += dt;

  ctx.clearRect(0, 0, W, H);
  const cx = W/2, cy = H/2;
  const fl = (W/2) / Math.tan(HFOV * Math.PI / 360);

  const yaw = -camYaw;
  const cosY = Math.cos(yaw),   sinY = Math.sin(yaw);
  const cosP = Math.cos(camPitch), sinP = Math.sin(camPitch);

  const visible = [];
  for (const p of particles) {
    const t2  = totalTime * p.driftRate;
    const bob = Math.sin(totalTime * BOB_HZ * p.bobRate * Math.PI*2 + p.bobPhase) * BOB_PX;
    const dx  = Math.cos(t2*1.1 + p.bobPhase) * p.driftX;
    const dz  = Math.sin(t2*0.8 + p.bobPhase) * p.driftZ;

    const wx = p.wx + dx,  wy = p.wy + bob,  wz = p.wz + dz;

    // yaw
    const x1 =  wx*cosY + wz*sinY;
    const y1 =  wy;
    const z1 = -wx*sinY + wz*cosY;
    // pitch
    const x2 =  x1;
    const y2 =  y1*cosP - z1*sinP;
    const z2 =  y1*sinP + z1*cosP;

    if (z2 < 60) continue;

    const scale = fl / z2;
    const sx = cx + x2*scale;
    const sy = cy - y2*scale;
    const sw = p.iw * scale;
    const sh = p.ih * scale;

    if (sw < 4) continue;
    if (sx+sw/2 < -50 || sx-sw/2 > W+50) continue;
    if (sy+sh/2 < -50 || sy-sh/2 > H+50) continue;

    const depthT = clamp((z2 - MIN_DIST*0.7) / (MAX_DIST - MIN_DIST*0.7), 0, 1);
    const alpha  = 1.0 - depthT * 0.82;

    visible.push({p, sx, sy, sw, sh, z2, alpha});
  }

  visible.sort((a,b) => b.z2 - a.z2);

  for (const {p,sx,sy,sw,sh,alpha} of visible) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(sx, sy);
    ctx.rotate(p.tilt);
    ctx.drawImage(p.img, -sw/2, -sh/2, sw, sh);
    ctx.restore();
  }

  requestAnimationFrame(frame);
}

// ── UTILS ────────────────────────────────────────────────
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function deg(r){return (r*180/Math.PI).toFixed(1);}
function dbg(msg){document.getElementById('dbg').textContent=msg;}
function loadImg(src){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>res(img); img.onerror=()=>res(null); img.src=src;
  });
}
</script>
</body>
</html>
