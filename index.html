<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Between Tongues</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; }
#cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
#three-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:1; }
#ui {
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.92); color:#fff; font-family:monospace;
  text-align:center; padding:48px; gap:14px;
}
#ui .sub { font-size:10px; color:#444; letter-spacing:0.22em; }
#ui h1   { font-size:16px; font-weight:normal; }
#ui p    { font-size:11px; color:#666; line-height:1.85; max-width:300px; }
#ui button {
  margin-top:20px; padding:13px 44px; background:#E8503A;
  color:#fff; border:none; font-family:monospace;
  font-size:11px; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer;
}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="three-canvas"></canvas>
<div id="ui">
  <div class="sub">谁在说话 · Who's Speaking? · C'est qui?</div>
  <h1>Between Tongues</h1>
  <p>Language drifts through the space.<br>Just watch.</p>
  <button onclick="start()">Enter ↗</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ASSETS = [
  'toronto.png','WO.png','BAI.png','beijing.png',
  'blue-bubble.png','blue-strip.png','BU.png',
  'bubbleCN1.png','bubbleEN1.png','bubbleFR1.png',
  'chinese-strip.png','english-strip.png','face3.png',
  'green-bubble.png','igotit.png','jsuis-perdu.png',
  'MING.png','montreal.png','red-bubble.png','SOS3.png'
];

// ── CONFIG ───────────────────────────────────────────────
const N_COPIES   = 3;      // copies of each image in the scene
const WORLD_SIZE = 8;      // scene spread radius
const REF_WIDTH  = 2.2;    // reference plane width at z=0 for a 1000px-wide image
const SPEED      = 0.18;   // drift speed (world units/sec)
const BOB_HZ     = 0.15;   // bobs per second
const BOB_AMT    = 0.08;   // bob amplitude (world units)

let renderer, scene, camera;
let planes = [];
let clock;

async function start() {
  document.getElementById('ui').style.display = 'none';

  // camera feed
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'} }, audio:false
    });
    document.getElementById('cam').srcObject = s;
  } catch(e) {}

  // Three.js setup — transparent canvas over video
  const canvas = document.getElementById('three-canvas');
  renderer = new THREE.WebGLRenderer({
    canvas,
    alpha: true,          // transparent bg → camera shows through
    antialias: true,
    powerPreference: 'low-power',  // save battery
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);  // fully transparent

  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 5);

  clock = new THREE.Clock();

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  // load textures + create planes
  const loader = new THREE.TextureLoader();
  await Promise.all(ASSETS.map(name => new Promise(res => {
    loader.load('./assets/' + name,
      tex => {
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        const img = tex.image;
        const ratio = img.height / img.width;

        for (let c = 0; c < N_COPIES; c++) {
          // size proportional to natural px width
          const w = (img.width / 1000) * REF_WIDTH * (0.7 + Math.random() * 0.6);
          const h = w * ratio;

          const geo = new THREE.PlaneGeometry(w, h);
          const mat = new THREE.MeshBasicMaterial({
            map: tex,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
          });
          const mesh = new THREE.Mesh(geo, mat);

          // random position in 3D space
          mesh.position.set(
            (Math.random() - 0.5) * WORLD_SIZE * 2,
            (Math.random() - 0.5) * WORLD_SIZE,
            (Math.random() - 0.5) * WORLD_SIZE * 1.5
          );

          // slight random tilt
          mesh.rotation.z = (Math.random() - 0.5) * 0.3;
          mesh.rotation.y = (Math.random() - 0.5) * 0.15;

          // depth-based opacity
          const depth = (mesh.position.z + WORLD_SIZE) / (WORLD_SIZE * 2); // 0=back, 1=front
          mat.opacity = 0.25 + depth * 0.7;

          // drift velocity — random direction
          const angle = Math.random() * Math.PI * 2;
          const spd   = SPEED * (0.5 + Math.random() * 0.8);
          mesh.userData = {
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd * 0.4,
            vz: (Math.random() - 0.5) * spd * 0.2,
            bobPhase: Math.random() * Math.PI * 2,
            bobRate:  0.6 + Math.random() * 0.8,
            baseY: mesh.position.y,
          };

          scene.add(mesh);
          planes.push(mesh);
        }
        res();
      },
      undefined,
      () => res()
    );
  })));

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t  = clock.getElapsedTime();

  const half = WORLD_SIZE;

  planes.forEach(mesh => {
    const d = mesh.userData;

    // drift
    mesh.position.x += d.vx * dt;
    mesh.position.z += d.vz * dt;

    // bob
    const bob = Math.sin(t * BOB_HZ * d.bobRate * Math.PI * 2 + d.bobPhase) * BOB_AMT;
    mesh.position.y = d.baseY + bob;

    // wrap in X and Z
    if (mesh.position.x >  half * 2) mesh.position.x = -half * 2;
    if (mesh.position.x < -half * 2) mesh.position.x =  half * 2;
    if (mesh.position.z >  half * 2) mesh.position.z = -half * 2;
    if (mesh.position.z < -half * 2) mesh.position.z =  half * 2;

    // update opacity by depth
    const depth = (mesh.position.z + half * 1.5) / (half * 3);
    mesh.material.opacity = Math.max(0.1, Math.min(0.95, 0.15 + depth * 0.8));
  });

  renderer.render(scene, camera);
}
</script>
</body>
</html>
