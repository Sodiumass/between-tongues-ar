<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Between Tongues</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; }
#cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
#three-canvas { position:fixed; inset:0; z-index:1; }
#ui {
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.92); color:#fff; font-family:monospace;
  text-align:center; padding:48px; gap:14px;
}
#ui .sub { font-size:10px; color:#444; letter-spacing:0.22em; }
#ui h1   { font-size:16px; font-weight:normal; }
#ui p    { font-size:11px; color:#666; line-height:1.85; max-width:300px; }
#ui button {
  margin-top:20px; padding:13px 44px; background:#E8503A;
  color:#fff; border:none; font-family:monospace;
  font-size:11px; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer;
}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="three-canvas"></canvas>
<div id="ui">
  <div class="sub">谁在说话 · Who's Speaking? · C'est qui?</div>
  <h1>Between Tongues</h1>
  <p>Language drifts through the space.<br>Just watch.</p>
  <button onclick="start()">Enter ↗</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ASSETS = [
  'BAI.png','beijing.png','blue-bubble.png','BU.png',
  'bubbleCN1.png','bubbleCN2.png','bubbleCN3.png','bubbleCN4.png',
  'bubbleEN1.png','bubbleEN2.png','bubbleEN3.png','bubbleEN4.png','bubbleEN5.png',
  'bubbleFR1.png','bubbleFR2.png','bubbleFR3.png','bubbleFR4.png',
  'emoji.png','etalors.png','face3.png','green-bubble.png',
  'igotit.png','ithink.png','jsuis-perdu.png','LUANMA.png','maaybe.png','MING.png',
  'mini1.png','mini2.png','mini3.png','mini4.png','mini5.png','mini6.png',
  'mini7.png','mini8.png','mini9.png','mini10.png','mini11.png','mini12.png',
  'mini13.png','mini14.png','mini15.png','mini16.png','mini17.png',
  'noise1.png','noise2.png','noise3.png','noise4.png','noise5.png','noise6.png',
  'noise7.png','noise8.png','noise9.png','noise10.png','noise11.png','noise12.png',
  'montreal.png','red-bubble.png','SOS3.png','toronto.png',
  'wiggleEN1.png','wiggleEN2.png','wiggleEN3.png',
  'wiggleFR1.png','wiggleFR2.png',
  'WO.png','YANWENZI.png'
];

// ── CONFIG ───────────────────────────────────────────────
const N_COPIES  = 1;      // copies of each image
const SPREAD    = 10;     // world space spread radius
const REF_WIDTH = 0.9;    // ref display width for a 1000px-wide image — smaller = all smaller
const SPEED     = 0.55;   // drift speed — feather-like
const BOB_HZ    = 0.22;
const BOB_AMT   = 0.12;

// max rotation speed per axis (radians/sec) — makes things tumble gently
const ROT_X_MAX = 0.008;
const ROT_Y_MAX = 0.012;
const ROT_Z_MAX = 0.005;

let renderer, scene, camera, clock;
let meshes = [];
let dragYaw = 0, dragPitch = 0;
let pointerDown = false, lastPX = 0, lastPY = 0;

async function start() {
  document.getElementById('ui').style.display = 'none';

  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'} }, audio:false
    });
    document.getElementById('cam').srcObject = s;
  } catch(e) {}

  const canvas = document.getElementById('three-canvas');
  renderer = new THREE.WebGLRenderer({
    canvas, alpha:true, antialias:true, powerPreference:'low-power'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.sortObjects = true;

  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 6);

  clock = new THREE.Clock();

  // ── DRAG TO EXPLORE ─────────────────────────────────
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { pointerDown=true; lastPX=e.clientX; lastPY=e.clientY; });
  window.addEventListener('pointerup',     () => pointerDown=false);
  window.addEventListener('pointercancel', () => pointerDown=false);
  window.addEventListener('pointermove', e => {
    if (!pointerDown) return;
    dragYaw   -= (e.clientX - lastPX) * 0.004;
    dragPitch -= (e.clientY - lastPY) * 0.002;
    dragPitch  = Math.max(-0.5, Math.min(0.5, dragPitch));
    lastPX = e.clientX; lastPY = e.clientY;
  });

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  const loader = new THREE.TextureLoader();

  await Promise.all(ASSETS.map(name => new Promise(res => {
    loader.load('./assets/' + name, tex => {
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      const iw = tex.image.width;
      const ih = tex.image.height;
      const ratio = ih / iw;

      for (let c = 0; c < N_COPIES; c++) {
        // size: proportional to natural px, with per-copy variance
        const sizeVar = 0.65 + Math.random() * 0.7;
        const w = (iw / 1000) * REF_WIDTH * sizeVar;
        const h = w * ratio;

        const geo = new THREE.PlaneGeometry(w, h);
        const mat = new THREE.MeshBasicMaterial({
          map: tex,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          opacity: 0.82,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.renderOrder = Math.random(); // avoid z-fighting flicker

        // scatter in 3D space
        mesh.position.set(
          (Math.random() - 0.5) * SPREAD * 2,
          (Math.random() - 0.5) * SPREAD,
          (Math.random() - 0.5) * SPREAD * 1.8
        );

        // initial random rotation — not all facing camera
        mesh.rotation.set(
          (Math.random() - 0.5) * Math.PI * 0.6,  // tip forward/back
          (Math.random() - 0.5) * Math.PI * 0.8,  // face sideways
          (Math.random() - 0.5) * Math.PI * 0.4   // roll
        );

        // drift velocity — feather-like random direction
        const angle = Math.random() * Math.PI * 2;
        const spd   = SPEED * (0.4 + Math.random() * 0.9);
        const vx    = Math.cos(angle) * spd;
        const vy    = (Math.random() - 0.5) * spd * 0.35;
        const vz    = (Math.random() - 0.5) * spd * 0.25;

        // independent rotation speed per axis — gentle tumble
        const rx = (Math.random() - 0.5) * 2 * ROT_X_MAX;
        const ry = (Math.random() - 0.5) * 2 * ROT_Y_MAX;
        const rz = (Math.random() - 0.5) * 2 * ROT_Z_MAX;

        // bob
        const bobPhase = Math.random() * Math.PI * 2;
        const bobRate  = 0.6 + Math.random() * 0.8;
        const baseY    = mesh.position.y;

        // occasional direction wobble
        const wobblePhase = Math.random() * Math.PI * 2;
        const wobbleAmt   = (Math.random() - 0.5) * 0.08;
        const baseOpacity = 0.25 + Math.random() * 0.70;

        mesh.userData = { vx, vy, vz, rx, ry, rz, bobPhase, bobRate, baseY, wobblePhase, wobbleAmt, baseOpacity };
        scene.add(mesh);
        meshes.push(mesh);
      }
      res();
    }, undefined, () => res());
  })));

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();
  const H  = SPREAD;

  meshes.forEach(m => {
    const d = m.userData;

    // feather wobble — slight direction change over time
    const wobble = Math.sin(t * 0.4 + d.wobblePhase) * d.wobbleAmt;

    m.position.x += (d.vx + wobble) * dt;
    m.position.y  = d.baseY + Math.sin(t * BOB_HZ * d.bobRate * Math.PI * 2 + d.bobPhase) * BOB_AMT;
    m.position.z += d.vz * dt;

    // gentle tumble on all three axes
    m.rotation.x += d.rx * dt * 60;
    m.rotation.y += d.ry * dt * 60;
    m.rotation.z += d.rz * dt * 60;

    // wrap X and Z — seamless loop
    const lim = H * 2;
    if (m.position.x >  lim) { m.position.x = -lim; d.baseY = (Math.random()-0.5)*H; }
    if (m.position.x < -lim) { m.position.x =  lim; d.baseY = (Math.random()-0.5)*H; }
    if (m.position.z >  H*2) { m.position.z = -H*2; }
    if (m.position.z < -H*2) { m.position.z =  H*2; }

    // depth modulates around each element's own base opacity
    const depth = (m.position.z + H * 1.5) / (H * 3.0);
    const depthMod = 0.4 + depth * 0.6; // far=0.4x, near=1.0x
    m.material.opacity = Math.max(0.06, Math.min(0.95, m.userData.baseOpacity * depthMod));
  });

  // smooth camera rotation from drag
  camera.rotation.y += (dragYaw   - camera.rotation.y) * 0.08;
  camera.rotation.x += (dragPitch - camera.rotation.x) * 0.08;

  renderer.render(scene, camera);
}
</script>
</body>
</html>
