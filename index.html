<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Between Tongues</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; }
#cam {
  position:fixed; inset:0; width:100%; height:100%;
  object-fit:cover; z-index:0;
}
#c {
  position:fixed; inset:0; width:100%; height:100%;
  z-index:1; pointer-events:none;
}
#ui {
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,0.92); color:#fff;
  font-family:monospace; text-align:center; padding:48px; gap:14px;
}
#ui .sub { font-size:10px; color:#444; letter-spacing:0.22em; }
#ui h1   { font-size:16px; font-weight:normal; letter-spacing:0.04em; }
#ui p    { font-size:11px; color:#666; line-height:1.85; max-width:300px; }
#ui button {
  margin-top:20px; padding:13px 44px; background:#E8503A;
  color:#fff; border:none; font-family:monospace;
  font-size:11px; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer;
}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div id="ui">
  <div class="sub">谁在说话 · Who's Speaking? · C'est qui?</div>
  <h1>Between Tongues</h1>
  <p>Language drifts through the space.<br>Just watch.</p>
  <button onclick="start()">Enter ↗</button>
</div>

<script>
// ── ASSETS ───────────────────────────────────────────────
const ASSETS = [
  'toronto.png','WO.png','BAI.png','beijing.png',
  'blue-bubble.png','blue-strip.png','BU.png',
  'bubbleCN1.png','bubbleEN1.png','bubbleFR1.png',
  'chinese-strip.png','english-strip.png','face3.png',
  'green-bubble.png','igotit.png','jsuis-perdu.png',
  'MING.png','montreal.png','red-bubble.png','SOS3.png'
];

// ── CONFIG ───────────────────────────────────────────────
// How big each element appears — fraction of screen width
// Near layer: ~0.28 of screen width. Far layer: ~0.12.
const LAYERS = [
  { count:6,  scale:0.28, speed:0.18, opacity:0.95, z:1.0 }, // near
  { count:10, scale:0.20, speed:0.13, opacity:0.80, z:0.7 }, // mid
  { count:12, scale:0.13, speed:0.08, opacity:0.55, z:0.4 }, // far
  { count:10, scale:0.08, speed:0.04, opacity:0.30, z:0.2 }, // very far
];

const BOB_HZ  = 0.18;  // bobs per second
const BOB_AMT = 0.012; // bob as fraction of screen height
const DRIFT_X = 0.006; // gentle horizontal drift per second (fraction of W)

// ── STATE ────────────────────────────────────────────────
let canvas, ctx, W, H, dpr;
let imgs = [];
let particles = [];
let lastTS = 0, T = 0;

// ── START ────────────────────────────────────────────────
async function start() {
  document.getElementById('ui').style.display = 'none';

  canvas = document.getElementById('c');
  ctx    = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  resize();
  window.addEventListener('resize', resize);

  // camera
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'} }, audio:false
    });
    document.getElementById('cam').srcObject = s;
  } catch(e) {}

  // load all images
  imgs = (await Promise.all(
    ASSETS.map(n => new Promise(res => {
      const img = new Image();
      img.onload  = () => res(img);
      img.onerror = () => res(null);
      img.src = './assets/' + n;
    }))
  )).filter(Boolean);

  spawn();
  requestAnimationFrame(loop);
}

// ── SPAWN ────────────────────────────────────────────────
function spawn() {
  particles = [];
  if (!imgs.length) return;

  // shuffle so different images appear in each layer
  const shuffled = [...imgs].sort(() => Math.random() - 0.5);
  let imgIdx = 0;

  LAYERS.forEach(layer => {
    for (let i = 0; i < layer.count; i++) {
      const img = shuffled[imgIdx++ % shuffled.length];
      const pw  = W * layer.scale;
      const ph  = pw * (img.naturalHeight / img.naturalWidth);

      // start at random position across screen + offscreen on both sides
      const x = Math.random() * (W + pw * 2) - pw;
      const y = Math.random() * H;

      // each element drifts in one direction (left or right) forever,
      // wrapping around when it exits the screen
      const dir = Math.random() < 0.5 ? 1 : -1;

      particles.push({
        img, pw, ph,
        x, y,
        baseY  : y,
        dir,
        speed  : layer.speed,   // fraction of W per second
        opacity: layer.opacity,
        bobPhase: Math.random() * Math.PI * 2,
        bobRate : 0.7 + Math.random() * 0.6,
        tilt   : (Math.random() - 0.5) * 0.18,
        // subtle size breath
        sizePhase: Math.random() * Math.PI * 2,
      });
    }
  });
}

// ── RESIZE ───────────────────────────────────────────────
function resize() {
  W   = window.innerWidth;
  H   = window.innerHeight;
  dpr = window.devicePixelRatio || 1;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  // respawn to fit new dimensions
  if (imgs.length) spawn();
}

// ── RENDER LOOP ──────────────────────────────────────────
function loop(ts) {
  const dt = Math.min((ts - lastTS) / 1000, 0.05);
  lastTS = ts;
  T += dt;

  ctx.clearRect(0, 0, W, H);

  // draw far → near (layers are already in far→near order in LAYERS)
  // particles are also in that order from spawn()
  particles.forEach(p => {
    // drift horizontally, wrap
    p.x += p.dir * p.speed * W * dt;
    const margin = p.pw * 1.2;
    if (p.dir > 0 && p.x - p.pw/2 > W + margin) p.x = -margin;
    if (p.dir < 0 && p.x + p.pw/2 < -margin)      p.x = W + margin;

    // gentle bob
    const bob = Math.sin(T * BOB_HZ * p.bobRate * Math.PI * 2 + p.bobPhase) * BOB_AMT * H;
    const sy  = p.baseY + bob;

    // subtle size breath (±3%)
    const sizeBreath = 1 + Math.sin(T * 0.3 + p.sizePhase) * 0.03;
    const pw = p.pw * sizeBreath;
    const ph = p.ph * sizeBreath;

    ctx.save();
    ctx.globalAlpha = p.opacity;
    ctx.translate(p.x, sy);
    ctx.rotate(p.tilt);
    ctx.drawImage(p.img, -pw/2, -ph/2, pw, ph);
    ctx.restore();
  });

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
