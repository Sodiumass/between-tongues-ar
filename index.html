<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Between Tongues</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
#cam {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}
#c {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  pointer-events:none;
}
#ui {
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.92);
  color:#fff;
  font-family:monospace;
  text-align:center;
  padding:48px;
  gap:14px;
}
#ui .sub {
  font-size:10px;
  color:#444;
  letter-spacing:0.22em;
}
#ui h1 {
  font-size:16px;
  font-weight:normal;
}
#ui p {
  font-size:11px;
  color:#666;
  line-height:1.85;
  max-width:320px;
}
#ui button {
  margin-top:20px;
  padding:13px 44px;
  background:#E8503A;
  color:#fff;
  border:none;
  font-family:monospace;
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  cursor:pointer;
}
#dbg {
  position:fixed;
  left:8px;
  bottom:8px;
  z-index:30;
  color:rgba(255,255,255,0.5);
  font:10px/1.5 monospace;
  background:rgba(0,0,0,0.28);
  padding:6px 8px;
  white-space:pre-line;
}
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="c"></canvas>

<div id="ui">
  <div class="sub">谁在说话 · Who's Speaking? · C'est qui?</div>
  <h1>Between Tongues</h1>
  <p>Language drifts through the space.<br>Just watch.</p>
  <button onclick="start()">Enter ↗</button>
</div>

<div id="dbg">waiting…</div>

<script>
const ASSETS = [
  'BAI.png','beijing.png','blue-bubble.png','BU.png',
  'bubbleCN1.png','bubbleCN2.png','bubbleCN3.png','bubbleCN4.png',
  'bubbleEN1.png','bubbleEN2.png','bubbleEN3.png','bubbleEN4.png','bubbleEN5.png',
  'bubbleFR1.png','bubbleFR2.png','bubbleFR3.png','bubbleFR4.png',
  'emoji.png','etalors.png','face3.png','green-bubble.png','igotit.png',
  'ithink.png','jsuis-perdu.png','LUANMA.png','maaybe.png','MING.png',
  'mini1.png','mini2.png','mini3.png','mini4.png','mini5.png','mini6.png',
  'mini7.png','mini8.png','mini9.png','mini10.png','mini11.png','mini12.png',
  'mini13.png','mini14.png','mini15.png','mini16.png','mini17.png',
  'montreal.png',
  'noise1.png','noise2.png','noise3.png','noise4.png','noise5.png','noise6.png',
  'noise7.png','noise8.png','noise9.png','noise10.png','noise11.png','noise12.png',
  'red-bubble.png','SOS3.png','toronto.png',
  'wiggleEN1.png','wiggleEN2.png','wiggleEN3.png','wiggleFR1.png','wiggleFR2.png',
  'WO.png','YANWENZI.png'
];

// 统一缩小
const REF_SCALE = 0.00018;
const MAX_DPR = 1.35;

// 透视
const CAMERA_Z = 1100;
const WORLD_MIN_Z = 300;
const WORLD_MAX_Z = 1600;

// 漂浮
const FLOAT_HZ = 0.09;
const FLOAT_X = 26;
const FLOAT_Y = 18;
const FLOAT_Z = 90;

// 角度变化
const ROT_HZ = 0.07;
const YAW_AMT   = 0.65;   // 左右转
const PITCH_AMT = 0.38;   // 前后仰
const ROLL_AMT  = 0.22;   // 平面滚转

const IMAGE_SCALE = {
  'BAI.png': 0.90,
  'beijing.png': 1.10,
  'blue-bubble.png': 1.00,
  'BU.png': 0.88,

  'bubbleCN1.png': 0.88,'bubbleCN2.png': 0.88,'bubbleCN3.png': 0.88,'bubbleCN4.png': 0.88,
  'bubbleEN1.png': 0.88,'bubbleEN2.png': 0.88,'bubbleEN3.png': 0.88,'bubbleEN4.png': 0.88,'bubbleEN5.png': 0.88,
  'bubbleFR1.png': 0.88,'bubbleFR2.png': 0.88,'bubbleFR3.png': 0.88,'bubbleFR4.png': 0.88,

  'emoji.png': 0.92,
  'etalors.png': 0.95,
  'face3.png': 1.08,
  'green-bubble.png': 1.00,
  'igotit.png': 0.90,
  'ithink.png': 0.92,
  'jsuis-perdu.png': 0.92,
  'LUANMA.png': 1.00,
  'maaybe.png': 0.92,
  'MING.png': 0.92,

  'mini1.png': 0.58,'mini2.png': 0.58,'mini3.png': 0.58,'mini4.png': 0.58,'mini5.png': 0.58,
  'mini6.png': 0.58,'mini7.png': 0.58,'mini8.png': 0.58,'mini9.png': 0.58,'mini10.png': 0.58,
  'mini11.png': 0.58,'mini12.png': 0.58,'mini13.png': 0.58,'mini14.png': 0.58,'mini15.png': 0.58,
  'mini16.png': 0.58,'mini17.png': 0.58,

  'montreal.png': 1.05,

  'noise1.png': 0.68,'noise2.png': 0.68,'noise3.png': 0.68,'noise4.png': 0.68,
  'noise5.png': 0.68,'noise6.png': 0.68,'noise7.png': 0.68,'noise8.png': 0.68,
  'noise9.png': 0.68,'noise10.png': 0.68,'noise11.png': 0.68,'noise12.png': 0.68,

  'red-bubble.png': 1.00,
  'SOS3.png': 0.92,
  'toronto.png': 1.08,

  'wiggleEN1.png': 0.80,'wiggleEN2.png': 0.80,'wiggleEN3.png': 0.80,
  'wiggleFR1.png': 0.80,'wiggleFR2.png': 0.80,

  'WO.png': 0.92,
  'YANWENZI.png': 1.00
};

let canvas, ctx, W, H, dpr;
let imgs = [];
let cards = [];
let T = 0;
let lastTS = 0;

async function start() {
  document.getElementById('ui').style.display = 'none';

  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');

  resize();
  window.addEventListener('resize', () => {
    resize();
    buildScene();
  });

  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    document.getElementById('cam').srcObject = s;
  } catch (e) {}

  imgs = (await Promise.all(
    ASSETS.map(name => new Promise(res => {
      const img = new Image();
      img.onload = () => {
        img._srcName = name;
        res(img);
      };
      img.onerror = () => {
        console.warn('Failed to load:', name);
        res(null);
      };
      img.src = './assets/' + name;
    }))
  )).filter(Boolean);

  document.getElementById('dbg').textContent =
    `assets listed: ${ASSETS.length}\nloaded: ${imgs.length}`;

  buildScene();
  requestAnimationFrame(loop);
}

function buildScene() {
  cards = [];
  if (!imgs.length) return;

  imgs.forEach(img => {
    const imgScale = IMAGE_SCALE[img._srcName] ?? 1;

    const baseW = img.naturalWidth * REF_SCALE * W * imgScale;
    const baseH = img.naturalHeight * REF_SCALE * W * imgScale;

    // 空间分布
    const x = (Math.random() * 1.3 - 0.65) * W;
    const y = (Math.random() * 0.9 - 0.45) * H;
    const z = WORLD_MIN_Z + Math.random() * (WORLD_MAX_Z - WORLD_MIN_Z);

    cards.push({
      img,
      baseW,
      baseH,

      x, y, z,

      opacityBase: 0.35 + Math.random() * 0.55,

      floatPhaseX: Math.random() * Math.PI * 2,
      floatPhaseY: Math.random() * Math.PI * 2,
      floatPhaseZ: Math.random() * Math.PI * 2,
      floatRateX: 0.7 + Math.random() * 0.6,
      floatRateY: 0.7 + Math.random() * 0.6,
      floatRateZ: 0.7 + Math.random() * 0.6,

      yawPhase: Math.random() * Math.PI * 2,
      pitchPhase: Math.random() * Math.PI * 2,
      rollPhase: Math.random() * Math.PI * 2,

      yawRate: 0.7 + Math.random() * 0.5,
      pitchRate: 0.7 + Math.random() * 0.5,
      rollRate: 0.7 + Math.random() * 0.5
    });
  });
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'medium';
}

function loop(ts) {
  const dt = Math.min((ts - lastTS) / 1000, 0.05);
  lastTS = ts;
  T += dt;

  ctx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2;

  const visible = [];

  for (const c of cards) {
    // 3D 漂浮
    const px = c.x + Math.sin(T * FLOAT_HZ * c.floatRateX * Math.PI * 2 + c.floatPhaseX) * FLOAT_X;
    const py = c.y + Math.cos(T * FLOAT_HZ * c.floatRateY * Math.PI * 2 + c.floatPhaseY) * FLOAT_Y;
    const pz = c.z + Math.sin(T * FLOAT_HZ * c.floatRateZ * Math.PI * 2 + c.floatPhaseZ) * FLOAT_Z;

    // 自由转动
    const yaw   = Math.sin(T * ROT_HZ * c.yawRate   * Math.PI * 2 + c.yawPhase)   * YAW_AMT;
    const pitch = Math.sin(T * ROT_HZ * c.pitchRate * Math.PI * 2 + c.pitchPhase) * PITCH_AMT;
    const roll  = Math.sin(T * ROT_HZ * c.rollRate  * Math.PI * 2 + c.rollPhase)  * ROLL_AMT;

    const perspective = CAMERA_Z / (CAMERA_Z + pz);
    const sx = cx + px * perspective;
    const sy = cy + py * perspective;

    // 关键：模拟卡片不是正面朝向你
    const faceX = Math.max(0.20, Math.cos(yaw));
    const faceY = Math.max(0.25, Math.cos(pitch));

    const drawW = c.baseW * perspective * faceX;
    const drawH = c.baseH * perspective * faceY;

    if (drawW < 2 || drawH < 2) continue;
    if (sx + drawW/2 < -120 || sx - drawW/2 > W + 120) continue;
    if (sy + drawH/2 < -120 || sy - drawH/2 > H + 120) continue;

    const alphaDepth = 1 - (pz - WORLD_MIN_Z) / (WORLD_MAX_Z - WORLD_MIN_Z);
    const alpha = clamp(c.opacityBase * (0.45 + alphaDepth * 0.75), 0.08, 1);

    visible.push({
      img: c.img,
      sx, sy, pz,
      drawW, drawH,
      roll,
      yaw,
      pitch,
      alpha
    });
  }

  visible.sort((a, b) => b.pz - a.pz);

  for (const v of visible) {
    ctx.save();
    ctx.globalAlpha = v.alpha;
    ctx.translate(v.sx, v.sy);

    // 先 roll
    ctx.rotate(v.roll);

    // 再加一点 shear 感，增强伪3D
    const shearX = Math.sin(v.yaw) * 0.18;
    const shearY = Math.sin(v.pitch) * 0.10;
    ctx.transform(1, shearY, shearX, 1, 0, 0);

    ctx.drawImage(v.img, -v.drawW / 2, -v.drawH / 2, v.drawW, v.drawH);
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}
</script>
</body>
</html>
