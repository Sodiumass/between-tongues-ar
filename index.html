<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Between Tongues</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
  }

  #cam {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }

  #c {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    touch-action:none;
  }

  #ui {
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.92);
    color:#fff;
    font-family:monospace;
    text-align:center;
    padding:40px;
    gap:12px;
  }

  #ui h1 {
    font-size:16px;
    font-weight:normal;
    letter-spacing:0.05em;
  }

  #ui p {
    font-size:11px;
    color:#666;
    line-height:1.8;
    max-width:320px;
  }

  #ui button {
    margin-top:20px;
    padding:13px 40px;
    background:#E8503A;
    color:#fff;
    border:none;
    font-family:monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    cursor:pointer;
  }

  #dbg {
    position:fixed;
    top:8px;
    left:8px;
    z-index:30;
    font-family:monospace;
    font-size:10px;
    color:yellow;
    pointer-events:none;
    line-height:1.5;
    white-space:pre-line;
    display:none;
    background:rgba(0,0,0,0.45);
    padding:6px 8px;
  }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="c"></canvas>

<div id="ui">
  <div style="font-size:10px;color:#444;letter-spacing:0.2em">谁在说话 · Who's Speaking? · C'est qui?</div>
  <h1>Between Tongues</h1>
  <p>
    Turn your body, or drag on screen to test.<br>
    Language floats around you in space.
  </p>
  <button onclick="begin()">Enter ↗</button>
</div>

<div id="dbg"></div>

<script>
// ─────────────────────────────────────────────────────────────
// ASSETS
// ─────────────────────────────────────────────────────────────
const ASSETS = [
  'toronto.png',
  'WO.png',
  'BAI.png',
  'beijing.png',
  'blue-bubble.png',
  'blue-strip.png',
  'BU.png',
  'bubbleCN1.png',
  'bubbleEN1.png',
  'bubbleFR1.png',
  'chinese-strip.png',
  'english-strip.png',
  'face3.png',
  'green-bubble.png',
  'igotit.png',
  'jsuis-perdu.png',
  'MING.png',
  'montreal.png',
  'red-bubble.png',
  'SOS3.png'
];

// 每张图自己的视觉权重
// 数值越大，默认越大
const IMAGE_SCALE = {
  'toronto.png':      1.05,
  'WO.png':           0.55,
  'BAI.png':          0.50,
  'beijing.png':      1.00,
  'blue-bubble.png':  0.82,
  'blue-strip.png':   1.28,
  'BU.png':           0.52,
  'bubbleCN1.png':    0.72,
  'bubbleEN1.png':    0.72,
  'bubbleFR1.png':    0.72,
  'chinese-strip.png':1.22,
  'english-strip.png':1.16,
  'face3.png':        1.00,
  'green-bubble.png': 0.82,
  'igotit.png':       0.66,
  'jsuis-perdu.png':  0.74,
  'MING.png':         0.56,
  'montreal.png':     0.95,
  'red-bubble.png':   0.82,
  'SOS3.png':         0.68
};

// ─────────────────────────────────────────────────────────────
// SETTINGS
// ─────────────────────────────────────────────────────────────
const HFOV = 60;          // 稍窄一点，更自然
const BOB_HZ = 0.15;      // 浮动频率
const BOB_PX = 10;        // 浮动幅度
const BASE_WORLD_SIZE = 95;
const MIN_DIST = 900;
const MAX_DIST = 2300;
const MAX_SCREEN_SCALE = 2.4; // 防止贴脸变得过大
const SHOW_DEBUG = false;

// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
let canvas, ctx, W, H;
let imgs = [];
let particles = [];

let camYaw = 0;
let camPitch = 0;

let gyroRef = null;
let gyroActive = false;
let gyroReady = false;

let lastTS = 0;
let totalTime = 0;

let isDragging = false;
let dragLastX = 0;
let dragLastY = 0;

// ─────────────────────────────────────────────────────────────
// BEGIN
// ─────────────────────────────────────────────────────────────
async function begin() {
  document.getElementById('ui').style.display = 'none';
  if (SHOW_DEBUG) document.getElementById('dbg').style.display = 'block';

  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  resize();
  window.addEventListener('resize', resize);

  enableDragFallback();

  // camera
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    document.getElementById('cam').srcObject = stream;
  } catch (e) {
    // 不影响主体验
  }

  // gyro
  await startGyro();

  // images
  const loaded = await Promise.all(
    ASSETS.map(name => loadImg('./assets/' + name))
  );
  imgs = loaded.filter(Boolean);

  scatter();
  requestAnimationFrame(frame);
}

// ─────────────────────────────────────────────────────────────
// IMAGE LOADING
// ─────────────────────────────────────────────────────────────
function loadImg(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      img._srcName = src.split('/').pop();
      resolve(img);
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

// ─────────────────────────────────────────────────────────────
// GYRO
// ─────────────────────────────────────────────────────────────
function startGyro() {
  return new Promise(resolve => {
    if (!window.DeviceOrientationEvent) {
      resolve();
      return;
    }

    const attach = () => {
      window.addEventListener('deviceorientation', onGyro, true);
      gyroActive = true;
      resolve();
    };

    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(result => {
          if (result === 'granted') attach();
          else resolve();
        })
        .catch(() => resolve());
    } else {
      attach();
    }
  });
}

function onGyro(e) {
  let alpha = e.alpha;

  // iOS Safari compass heading fallback
  if (typeof e.webkitCompassHeading === 'number') {
    alpha = 360 - e.webkitCompassHeading;
  }

  const beta = e.beta ?? 90;

  if (alpha == null) return;

  if (gyroRef === null) {
    gyroRef = alpha;
  }

  let d = alpha - gyroRef;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;

  // 右转时让空间往左滑过去，更像相机在转
  camYaw = -d * Math.PI / 180;
  camPitch = (beta - 90) * Math.PI / 180 * 0.16;

  gyroReady = true;

  if (SHOW_DEBUG) {
    document.getElementById('dbg').textContent =
      `gyro:${gyroActive ? 'on' : 'off'}
alpha:${Number(alpha).toFixed(1)}
ref:${Number(gyroRef).toFixed(1)}
delta:${d.toFixed(1)}°
yaw:${(camYaw * 180 / Math.PI).toFixed(1)}°
pitch:${(camPitch * 180 / Math.PI).toFixed(1)}°`;
  }
}

// ─────────────────────────────────────────────────────────────
// DRAG FALLBACK
// ─────────────────────────────────────────────────────────────
function enableDragFallback() {
  const el = document.getElementById('c');

  el.addEventListener('pointerdown', (e) => {
    isDragging = true;
    dragLastX = e.clientX;
    dragLastY = e.clientY;
  });

  window.addEventListener('pointerup', () => {
    isDragging = false;
  });

  window.addEventListener('pointercancel', () => {
    isDragging = false;
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;

    const dx = e.clientX - dragLastX;
    const dy = e.clientY - dragLastY;
    dragLastX = e.clientX;
    dragLastY = e.clientY;

    // 只有在 gyro 没准备好时，拖拽主控
    if (!gyroReady) {
      camYaw += dx * 0.004;
      camPitch += dy * 0.002;
      camPitch = clamp(camPitch, -0.35, 0.35);
    }
  });
}

// ─────────────────────────────────────────────────────────────
// SCATTER
// ─────────────────────────────────────────────────────────────
function scatter() {
  particles = [];
  if (!imgs.length) return;

  // 每张图只用一次
  const chosen = shuffle(imgs);

  for (let i = 0; i < chosen.length; i++) {
    const img = chosen[i];
    const ratio = img.naturalHeight / img.naturalWidth;

    // 环绕式分布：围绕观者一圈
    const theta = Math.random() * Math.PI * 2;

    // 垂直角度不要太大，不然像满天飞
    const phi = (Math.random() - 0.5) * Math.PI * 0.34;

    // 距离拉开，制造前后层次
    const dist = MIN_DIST + Math.random() * (MAX_DIST - MIN_DIST);

    const wx = dist * Math.cos(phi) * Math.sin(theta);
    const wy = dist * Math.sin(phi);
    const wz = dist * Math.cos(phi) * Math.cos(theta);

    const imgScale = IMAGE_SCALE[img._srcName] ?? 1;
    const randomNudge = 0.92 + Math.random() * 0.18;

    const iw = BASE_WORLD_SIZE * imgScale * randomNudge;
    const ih = iw * ratio;

    particles.push({
      img,
      iw,
      ih,
      wx,
      wy,
      wz,
      bobPhase: Math.random() * Math.PI * 2,
      bobRate: 0.8 + Math.random() * 0.4,
      tilt: (Math.random() - 0.5) * 0.12
    });
  }
}

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// ─────────────────────────────────────────────────────────────
// RESIZE
// ─────────────────────────────────────────────────────────────
function resize() {
  if (!canvas) return;

  W = window.innerWidth;
  H = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  if (ctx) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }
}

// ─────────────────────────────────────────────────────────────
// FRAME
// ─────────────────────────────────────────────────────────────
function frame(ts) {
  const dt = Math.min((ts - lastTS) / 1000, 0.05);
  lastTS = ts;
  totalTime += dt;

  ctx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2;

  const fl = (W / 2) / Math.tan(HFOV * Math.PI / 360);

  // 相机转头，世界反向
  const yaw = -camYaw;
  const pitch = camPitch;

  const cosY = Math.cos(yaw);
  const sinY = Math.sin(yaw);
  const cosP = Math.cos(pitch);
  const sinP = Math.sin(pitch);

  const visible = [];

  for (const p of particles) {
    const bob = Math.sin(
      totalTime * BOB_HZ * p.bobRate * Math.PI * 2 + p.bobPhase
    ) * BOB_PX;

    const wx = p.wx;
    const wy = p.wy + bob;
    const wz = p.wz;

    // yaw
    const x1 = wx * cosY + wz * sinY;
    const y1 = wy;
    const z1 = -wx * sinY + wz * cosY;

    // pitch
    const x2 = x1;
    const y2 = y1 * cosP - z1 * sinP;
    const z2 = y1 * sinP + z1 * cosP;

    if (z2 < 80) continue;

    let scale = fl / z2;
    scale = Math.min(scale, MAX_SCREEN_SCALE);

    const sx = cx + x2 * scale;
    const sy = cy - y2 * scale;

    const sw = p.iw * scale;
    const sh = p.ih * scale;

    if (sw < 6 || sh < 6) continue;
    if (sx + sw / 2 < -40 || sx - sw / 2 > W + 40) continue;
    if (sy + sh / 2 < -40 || sy - sh / 2 > H + 40) continue;

    const depthT = invLerp(MIN_DIST * 0.7, MAX_DIST, z2);
    const alpha = lerp(0.98, 0.28, clamp(depthT, 0, 1));

    visible.push({
      p, sx, sy, sw, sh, z2, alpha
    });
  }

  // far → near
  visible.sort((a, b) => b.z2 - a.z2);

  for (const item of visible) {
    const { p, sx, sy, sw, sh, alpha } = item;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(sx, sy);
    ctx.rotate(p.tilt);
    ctx.drawImage(p.img, -sw / 2, -sh / 2, sw, sh);
    ctx.restore();
  }

  requestAnimationFrame(frame);
}

// ─────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────
function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function invLerp(a, b, v) {
  if (a === b) return 0;
  return (v - a) / (b - a);
}
</script>
</body>
</html>
