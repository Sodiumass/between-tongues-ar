<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Between Tongues</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
  }

  #cam {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }

  #c {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    touch-action:none;
  }

  #ui {
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.92);
    color:#fff;
    font-family:monospace;
    text-align:center;
    padding:40px;
    gap:12px;
  }

  #ui h1 {
    font-size:16px;
    font-weight:normal;
    letter-spacing:0.05em;
  }

  #ui p {
    font-size:11px;
    color:#777;
    line-height:1.8;
    max-width:340px;
  }

  #ui button {
    margin-top:20px;
    padding:13px 40px;
    background:#E8503A;
    color:#fff;
    border:none;
    font-family:monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    cursor:pointer;
  }

  #dbg {
    position:fixed;
    top:8px;
    left:8px;
    z-index:30;
    font-family:monospace;
    font-size:10px;
    color:yellow;
    line-height:1.45;
    white-space:pre-line;
    background:rgba(0,0,0,0.45);
    padding:6px 8px;
    pointer-events:none;
  }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="c"></canvas>

<div id="ui">
  <div style="font-size:10px;color:#444;letter-spacing:0.2em">谁在说话 · Who's Speaking? · C'est qui?</div>
  <h1>Between Tongues</h1>
  <p>
    Turn your body to look around.<br>
    If motion permission is blocked, the words will not move with your phone.
  </p>
  <button onclick="begin()">Enter ↗</button>
</div>

<div id="dbg">waiting…</div>

<script>
// ─────────────────────────────────────────
// 67 ASSETS
// ─────────────────────────────────────────
const ASSETS = [
  'BAI.png',

  'wiggleEN1.png',

  'wiggleFR2.png',

  'WO.png',
  'YANWENZI.png'
];

// ─────────────────────────────────────────
// VISUAL SCALE PER IMAGE
// 数值大 = 默认更大
// ─────────────────────────────────────────
const IMAGE_SCALE = {
  'BAI.png': 0.95,
  'beijing.png': 1.20,
  'blue-bubble.png': 1.10,
  'BU.png': 0.95,

  'bubbleCN1.png': 0.95,
  'bubbleCN2.png': 0.95,
  'bubbleCN3.png': 0.95,
  'bubbleCN4.png': 0.95,

  'bubbleEN1.png': 0.95,
  'bubbleEN2.png': 0.95,
  'bubbleEN3.png': 0.95,
  'bubbleEN4.png': 0.95,
  'bubbleEN5.png': 0.95,

  'bubbleFR1.png': 0.95,
  'bubbleFR2.png': 0.95,
  'bubbleFR3.png': 0.95,
  'bubbleFR4.png': 0.95,

  'emoji.png': 1.00,
  'etalors.png': 1.05,
  'face3.png': 1.25,
  'green-bubble.png': 1.10,
  'igotit.png': 0.95,
  'ithink.png': 1.00,
  'jsuis-perdu.png': 1.00,
  'LUANMA.png': 1.12,
  'maaybe.png': 1.00,
  'MING.png': 1.00,

  'mini1.png': 0.75,
  'mini2.png': 0.75,
  'mini3.png': 0.75,
  'mini4.png': 0.75,
  'mini5.png': 0.75,
  'mini6.png': 0.75,
  'mini7.png': 0.75,
  'mini8.png': 0.75,
  'mini9.png': 0.75,
  'mini10.png': 0.75,
  'mini11.png': 0.75,
  'mini12.png': 0.75,
  'mini13.png': 0.75,
  'mini14.png': 0.75,
  'mini15.png': 0.75,
  'mini16.png': 0.75,
  'mini17.png': 0.75,

  'montreal.png': 1.15,

  'noise1.png': 0.82,
  'noise2.png': 0.82,
  'noise3.png': 0.82,
  'noise4.png': 0.82,
  'noise5.png': 0.82,
  'noise6.png': 0.82,
  'noise7.png': 0.82,
  'noise8.png': 0.82,
  'noise9.png': 0.82,
  'noise10.png': 0.82,
  'noise11.png': 0.82,
  'noise12.png': 0.82,

  'red-bubble.png': 1.10,
  'SOS3.png': 1.00,
  'toronto.png': 1.20,

  'wiggleEN1.png': 0.92,
  'wiggleEN2.png': 0.92,
  'wiggleEN3.png': 0.92,
  'wiggleFR1.png': 0.92,
  'wiggleFR2.png': 0.92,

  'WO.png': 1.00,
  'YANWENZI.png': 1.12
};

// ─────────────────────────────────────────
// SETTINGS
// ─────────────────────────────────────────
const HFOV = 62;
const BOB_HZ = 0.14;
const BOB_PX = 8;

const BASE_WORLD_SIZE = 140;   // 比上一版更大
const MIN_DIST = 700;          // 拉近
const MAX_DIST = 1700;
const MAX_SCREEN_SCALE = 3.2;  // 允许更大
const FRONT_BIAS = 0.82;       // 越大越偏向前方区域

// ─────────────────────────────────────────
// STATE
// ─────────────────────────────────────────
let canvas, ctx, W, H;
let imgs = [];
let particles = [];

let camYaw = 0;
let camPitch = 0;

let orientationOK = false;
let gotGyroData = false;
let headingRef = null;

let lastTS = 0;
let totalTime = 0;

let isDragging = false;
let dragLastX = 0;
let dragLastY = 0;

// ─────────────────────────────────────────
// BEGIN
// ─────────────────────────────────────────
async function begin() {
  document.getElementById('ui').style.display = 'none';

  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  resize();
  window.addEventListener('resize', resize);

  enableFallbackDrag();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    document.getElementById('cam').srcObject = stream;
  } catch (e) {}

  await startOrientation();

  const loaded = await Promise.all(ASSETS.map(name => loadImg('./assets/' + name)));
  imgs = loaded.filter(Boolean);

  console.log('ASSETS:', ASSETS.length);
  console.log('LOADED:', imgs.length);

  scatter();
  requestAnimationFrame(frame);
}

// ─────────────────────────────────────────
// LOAD IMAGE
// ─────────────────────────────────────────
function loadImg(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      img._srcName = src.split('/').pop();
      resolve(img);
    };
    img.onerror = () => {
      console.warn('Failed to load:', src);
      resolve(null);
    };
    img.src = src;
  });
}

// ─────────────────────────────────────────
// ORIENTATION / GYRO
// ─────────────────────────────────────────
async function startOrientation() {
  const dbg = document.getElementById('dbg');
  dbg.textContent = 'requesting motion permission…';

  if (!window.DeviceOrientationEvent) {
    dbg.textContent = 'DeviceOrientationEvent not supported';
    return;
  }

  try {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      const result = await DeviceOrientationEvent.requestPermission();
      if (result !== 'granted') {
        dbg.textContent = 'motion permission denied';
        return;
      }
    }

    window.addEventListener('deviceorientation', onOrientation, true);
    window.addEventListener('deviceorientationabsolute', onOrientation, true);

    orientationOK = true;
    dbg.textContent = 'orientation listener attached\nwaiting for sensor data…';
  } catch (err) {
    dbg.textContent = 'motion setup failed';
  }
}

function onOrientation(e) {
  const dbg = document.getElementById('dbg');

  let heading = null;

  // iOS Safari 常见
  if (typeof e.webkitCompassHeading === 'number' && !Number.isNaN(e.webkitCompassHeading)) {
    heading = e.webkitCompassHeading; // 0~360
  }
  // 其他设备 fallback
  else if (typeof e.alpha === 'number' && !Number.isNaN(e.alpha)) {
    heading = 360 - e.alpha;
  }

  const beta = (typeof e.beta === 'number' && !Number.isNaN(e.beta)) ? e.beta : 90;

  if (heading == null) {
    dbg.textContent = 'sensor attached but heading is null';
    return;
  }

  gotGyroData = true;

  if (headingRef === null) {
    headingRef = heading;
  }

  let d = heading - headingRef;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;

  // 这里直接用真实旋转去驱动视角
  camYaw = d * Math.PI / 180;

  // 轻一点 pitch，防止上下过敏
  camPitch = (beta - 90) * Math.PI / 180 * 0.12;
  camPitch = clamp(camPitch, -0.30, 0.30);

  dbg.textContent =
    `orientation:${orientationOK ? 'on' : 'off'}
gyroData:${gotGyroData ? 'yes' : 'no'}
heading:${heading.toFixed(1)}
ref:${headingRef.toFixed(1)}
delta:${d.toFixed(1)}°
yaw:${(camYaw * 180 / Math.PI).toFixed(1)}°
beta:${beta.toFixed(1)}`;
}

// ─────────────────────────────────────────
// FALLBACK DRAG
// 只有在真的没有陀螺仪数据时才用
// ─────────────────────────────────────────
function enableFallbackDrag() {
  const el = document.getElementById('c');

  el.addEventListener('pointerdown', (e) => {
    isDragging = true;
    dragLastX = e.clientX;
    dragLastY = e.clientY;
  });

  window.addEventListener('pointerup', () => {
    isDragging = false;
  });

  window.addEventListener('pointercancel', () => {
    isDragging = false;
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    if (gotGyroData) return; // 有传感器数据就不用手拖

    const dx = e.clientX - dragLastX;
    const dy = e.clientY - dragLastY;
    dragLastX = e.clientX;
    dragLastY = e.clientY;

    camYaw += dx * 0.0045;
    camPitch += dy * 0.0022;
    camPitch = clamp(camPitch, -0.30, 0.30);
  });
}

// ─────────────────────────────────────────
// SCATTER
// 更偏向前方半球，而不是 360 全包围
// ─────────────────────────────────────────
function scatter() {
  particles = [];
  if (!imgs.length) return;

  const chosen = shuffle(imgs);

  for (let i = 0; i < chosen.length; i++) {
    const img = chosen[i];
    const ratio = img.naturalHeight / img.naturalWidth;

    // 多数集中在前方，但保留少量偏侧方
    let theta;
    if (Math.random() < FRONT_BIAS) {
      theta = (Math.random() - 0.5) * Math.PI * 0.95; // 前方范围
    } else {
      theta = (Math.random() - 0.5) * Math.PI * 1.8;  // 少量更散
    }

    const phi = (Math.random() - 0.5) * Math.PI * 0.34;
    const dist = MIN_DIST + Math.random() * (MAX_DIST - MIN_DIST);

    const wx = dist * Math.cos(phi) * Math.sin(theta);
    const wy = dist * Math.sin(phi);
    const wz = dist * Math.cos(phi) * Math.cos(theta);

    const imgScale = IMAGE_SCALE[img._srcName] ?? 1;
    const randomNudge = 0.9 + Math.random() * 0.22;

    const iw = BASE_WORLD_SIZE * imgScale * randomNudge;
    const ih = iw * ratio;

    particles.push({
      img,
      iw,
      ih,
      wx,
      wy,
      wz,
      bobPhase: Math.random() * Math.PI * 2,
      bobRate: 0.8 + Math.random() * 0.5,
      tilt: (Math.random() - 0.5) * 0.14
    });
  }
}

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// ─────────────────────────────────────────
// RESIZE
// ─────────────────────────────────────────
function resize() {
  if (!canvas) return;

  W = window.innerWidth;
  H = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  if (ctx) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }
}

// ─────────────────────────────────────────
// FRAME
// ─────────────────────────────────────────
function frame(ts) {
  const dt = Math.min((ts - lastTS) / 1000, 0.05);
  lastTS = ts;
  totalTime += dt;

  ctx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2;
  const fl = (W / 2) / Math.tan(HFOV * Math.PI / 360);

  // 用户向右转头，世界往左滑过去
  const yaw = -camYaw;
  const pitch = camPitch;

  const cosY = Math.cos(yaw);
  const sinY = Math.sin(yaw);
  const cosP = Math.cos(pitch);
  const sinP = Math.sin(pitch);

  const visible = [];

  for (const p of particles) {
    const bob = Math.sin(
      totalTime * BOB_HZ * p.bobRate * Math.PI * 2 + p.bobPhase
    ) * BOB_PX;

    const wx = p.wx;
    const wy = p.wy + bob;
    const wz = p.wz;

    // yaw
    const x1 = wx * cosY + wz * sinY;
    const y1 = wy;
    const z1 = -wx * sinY + wz * cosY;

    // pitch
    const x2 = x1;
    const y2 = y1 * cosP - z1 * sinP;
    const z2 = y1 * sinP + z1 * cosP;

    if (z2 < 60) continue;

    let scale = fl / z2;
    scale = Math.min(scale, MAX_SCREEN_SCALE);

    const sx = cx + x2 * scale;
    const sy = cy - y2 * scale;

    const sw = p.iw * scale;
    const sh = p.ih * scale;

    if (sw < 3.5 || sh < 3.5) continue;
    if (sx + sw / 2 < -80 || sx - sw / 2 > W + 80) continue;
    if (sy + sh / 2 < -80 || sy - sh / 2 > H + 80) continue;

    const depthT = invLerp(MIN_DIST * 0.7, MAX_DIST, z2);
    const alpha = lerp(1.0, 0.28, clamp(depthT, 0, 1));

    visible.push({ p, sx, sy, sw, sh, z2, alpha });
  }

  visible.sort((a, b) => b.z2 - a.z2);

  for (const item of visible) {
    const { p, sx, sy, sw, sh, alpha } = item;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(sx, sy);
    ctx.rotate(p.tilt);
    ctx.drawImage(p.img, -sw / 2, -sh / 2, sw, sh);
    ctx.restore();
  }

  requestAnimationFrame(frame);
}

// ─────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────
function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}
function lerp(a, b, t) {
  return a + (b - a) * t;
}
function invLerp(a, b, v) {
  if (a === b) return 0;
  return (v - a) / (b - a);
}
</script>
