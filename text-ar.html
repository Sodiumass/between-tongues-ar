<div id="ui">

  </h1>
  <div style="font-size:16px; font-style:italic; color:#888; margin-top:2px; line-height:1.5;">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const DPR = Math.min(window.devicePixelRatio || 1, 2);

// ═══════════════════════════════════════════════════════
// CONTENT
// ═══════════════════════════════════════════════════════

const WORDS_ZH = [
  '说','听','语','言','我','你','他','间','字','声','口','心','意','思','话',
  '写','读','懂','找','失','名','词','句','译','换','借','混','跨','界','边',
  '沉','默','漂','流','根','土','乡','异','归','离','脑','舌','喉','气','息',
  '音','调','腔','韵','换','讠','耳','目','手','足','氵','木','人','女','门',
];
const SENTENCES_ZH = [
  '等等…','还是说','怎么说','然后','不对',
  '我不知道怎么翻译','这个词只有中文有',
  '你懂我的意思吗','说不出来','忘词了',
  '在哪一种语言里','我才是我自己',
  '妈妈的语言','学校的语言','梦里的语言',
  '两种语言之间的沉默','有些话只能用这个说',
  '我在两种语言之间长大',
  '翻译不了的感觉','心里想的是中文',
  '说出来变成了别的','语言在喉咙里打架',
  '我用哪种语言哭','我用哪种语言笑',
  '名字被叫错的感觉',
];
const WORDS_FR = [
  'langue','dire','entre','mots','jamais','parler','voix','perdre','trouver',
  'sens','silence','souffle','frontière','glisser','appartenir','mémoire',
  'accent','traduire','manquer','chercher','habiter','corps','racine','dérive',
  'passage','seuil','identité','nommer','résonner','naviguer',
  'é','è','ê','à','â','ç','œ','ô','î','ï',
];
const SENTENCES_FR = [
  'mais…','c\'est quoi','comment dire',
  'et alors','ce n\'est pas ça',
  'je cherche mes mots','tu comprends?',
  'comment expliquer','c\'est différent',
  'dans quelle langue je rêve',
  'je me perds entre les deux',
  'le mot exact n\'existe pas',
  'une langue que j\'habite à moitié',
  'glisser d\'une langue à l\'autre',
  'ma voix change selon la langue',
  'les mots me manquent',
  'je ne suis pas la même personne',
  'quelque chose se perd','quelque chose reste',
];
const WORDS_EN = [
  'speak','hear','lost','found','between','word','tongue','slip','drift','gap',
  'silence','breath','border','cross','belong','memory','accent','translate',
  'switch','code','hybrid','fluid','root','echo','trace','hold','inherit',
  'navigate','rupture','carry',
  '/ə/','/θ/','/tɕ/','/y/','/ʒ/','/ɑ/','/œ/','/ɥ/','/ŋ/','/ʁ/',
  'A','B','Q','Z','X',
];
const SENTENCES_EN = [
  'sorry…','I mean','how do I say',
  'and then','that\'s not what I meant',
  'I think better in—','wait, in which language',
  'the word doesn\'t exist in English',
  'I grew up between','lost in translation',
  'which version of me are you talking to',
  'my accent gives me away',
  'I dream in more than one language',
  'something gets lost','something stays',
  'a different self in every language',
  'what doesn\'t translate',
  'neither here nor there',
  'the language I inherited',
  'code-switching in my sleep',
  'the gap between','the in-between',
];

// Three.js飘动层：单字+词
const TEXTS_TAGGED = [
  ...WORDS_ZH.map(t => ({ text:t, lang:'zh' })),
  ...WORDS_FR.map(t => ({ text:t, lang:'fr' })),
  ...WORDS_EN.map(t => ({ text:t, lang:'en' })),
];

// ═══════════════════════════════════════════════════════
// LANG CONFIG（单字飘动用，保持红绿蓝）
// ═══════════════════════════════════════════════════════
const SERIF_ZH = '"Noto Serif SC","STSong","华文宋体","SimSun","宋体",serif';

const LANG_CONFIG = {
  zh: {
    fonts: [`{s}px ${SERIF_ZH}`, `bold {s}px ${SERIF_ZH}`],
    colors: ['#e84545','#d63a3a','#f05555','#c93030','#e86060','#bf2a2a'],
    stripFont: (sz) => `${sz}px ${SERIF_ZH}`,
  },
  fr: {
    fonts: [`italic {s}px "Georgia",serif`, `italic {s}px "Times New Roman",serif`],
    colors: ['#4a8fd9','#3a7ec8','#5a9fe8','#2d72bb','#6aaee8','#1f5fa0'],
    stripFont: (sz) => `italic ${sz}px "Georgia","Times New Roman",serif`,
  },
  en: {
    fonts: [`{s}px "Courier Prime",monospace`, `bold {s}px "Courier Prime",monospace`,
            `italic {s}px "Courier Prime",monospace`],
    colors: ['#8fcc3b','#7db82e','#9fd948','#6aa022','#aad960','#5a8c18'],
    stripFont: (sz) => `${sz}px "Courier Prime","Courier New",monospace`,
  },
};

// ═══════════════════════════════════════════════════════
// STRIP SYSTEM — 全部用canvas 2D手动绘制+逐帧更新
// 黑灰色系，每条strip有独立depth(opacity, speed, size)
// parallax：受dragYaw/dragPitch影响，但系数不同于Three.js
// ═══════════════════════════════════════════════════════

// 全局共享的交互状态（Three.js和strips都读）
let dragYaw = 0, dragPitch = 0;
let targetYaw = 0, targetPitch = 0;
let pointerDown = false, lastPX = 0, lastPY = 0;

let stripsCanvas, stripsCtx;
const strips = [];       // 所有strip的状态

// 灰黑色palette，opacity通过depth控制
const GRAY_PALETTE = [
  '#1a1a1a','#2c2c2c','#3d3d3d','#4f4f4f',
  '#606060','#777','#888','#999',
];

function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b+1)); }
function randItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function initStrips() {
  stripsCanvas = document.getElementById('strips-canvas');
  stripsCtx = stripsCanvas.getContext('2d');
  resizeStripsCanvas();

  const W = stripsCanvas.width / DPR;
  const H = stripsCanvas.height / DPR;

  // 所有短句混在一起，打散顺序
  const allSentences = [
    ...SENTENCES_ZH.map(t=>({text:t,lang:'zh'})),
    ...SENTENCES_FR.map(t=>({text:t,lang:'fr'})),
    ...SENTENCES_EN.map(t=>({text:t,lang:'en'})),
  ].sort(()=>Math.random()-0.5);

  // 生成约18条strips，参数各异
  const STRIP_COUNT = 18;
  for (let i = 0; i < STRIP_COUNT; i++) {
    const dir = randItem(['v','v','h','h','d','d','d']); // 斜角多一点
    
    // depth 0=近(大、不透明) 1=远(小、透明)
    // 偏向中远景，更有层次
    const depth = rand(0.2, 1.0);

    // 字号随depth变化：近大远小
    const fontSize = Math.round(rand(11, 19) * (1 - depth * 0.4));

    // opacity: 近处清晰，远处朦胧
    const baseOpacity = rand(0.12, 0.55) * (1 - depth * 0.5);

    // 速度：近慢远快（反直觉但更梦幻）或随机
    const speed = rand(0.3, 1.1) * (0.5 + depth * 0.8) * (dir === 'v' ? 1 : 0.85);

    // 每条strip取一部分句子（5–10个），重复两次无缝循环
    const count = randInt(5, 10);
    const src = allSentences.slice((i * 7) % allSentences.length);
    const items = [];
    for (let j = 0; j < count; j++) items.push(src[j % src.length]);
    const looped = [...items, ...items]; // 两份，用于无缝

    // 颜色：从灰黑palette随机，opacity单独控制
    const baseColor = randItem(GRAY_PALETTE);

    // 斜角度数
    const angleDeg = dir === 'd' ? randItem([-15,-10,-6,6,10,15]) : 0;

    // strip的初始偏移（让各strip不同时出现）
    const offset = rand(0, 1); // 0–1，百分比位置

    // parallax系数：每条不同，depth越大parallax越小（远处移得少）
    const parallaxX = rand(0.01, 0.06) * (1 - depth * 0.6) * (Math.random()>0.5?1:-1);
    const parallaxY = rand(0.01, 0.04) * (1 - depth * 0.6) * (Math.random()>0.5?1:-1);

    // 垂直strip的x位置，水平strip的y位置
    const posV = rand(0.02, 0.98); // 相对宽度
    const posH = rand(0.02, 0.98); // 相对高度

    const lang = items[0]?.lang || 'en';

    strips.push({
      dir, depth, fontSize, baseOpacity, speed, looped,
      baseColor, angleDeg, offset, parallaxX, parallaxY,
      posV, posH, lang,
      // 运行时状态
      progress: offset, // 0–1，在循环内的位置
      opacity: baseOpacity, // 会fade
      fadeDir: 1,
      fadeTimer: rand(3, 12),
    });
  }
}

function resizeStripsCanvas() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  stripsCanvas.width  = W * DPR;
  stripsCanvas.height = H * DPR;
  stripsCanvas.style.width  = W + 'px';
  stripsCanvas.style.height = H + 'px';
  stripsCtx.scale(DPR, DPR);
}

// 把 "#rrggbb" 转成 rgba(r,g,b,a) 字符串
function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

let lastStripTime = 0;
function drawStrips(dt, t) {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const ctx = stripsCtx;
  ctx.clearRect(0, 0, W, H);

  // 当前平滑后的相机偏移量（pixels）
  const camOffX = dragYaw   * W * 0.15;
  const camOffY = dragPitch * H * 0.15;

  strips.forEach(strip => {
    const { dir, fontSize, baseOpacity, speed, looped, baseColor,
            angleDeg, parallaxX, parallaxY, posV, posH, lang } = strip;

    // 每帧推进progress
    strip.progress += speed * dt * 0.012;
    if (strip.progress > 1) strip.progress -= 1;

    // opacity随机fade（让画面不那么机械）
    strip.fadeTimer -= dt;
    if (strip.fadeTimer <= 0) {
      strip.fadeDir *= -1;
      strip.fadeTimer = rand(2, 8);
    }
    strip.opacity = Math.max(0.04, Math.min(
      baseOpacity,
      strip.opacity + strip.fadeDir * dt * rand(0.008, 0.025)
    ));

    // parallax偏移（滑动时strip轻微位移，造成层次感）
    const px = camOffX * parallaxX * 8;
    const py = camOffY * parallaxY * 8;

    ctx.save();

    if (dir === 'd') {
      // 斜角：旋转整个坐标系
      const cx = W * posV + px;
      const cy = H * posH + py;
      ctx.translate(cx, cy);
      ctx.rotate(angleDeg * Math.PI / 180);
      ctx.translate(-cx, -cy);
    }

    ctx.font = LANG_CONFIG[lang].stripFont(fontSize);
    ctx.fillStyle = hexAlpha(baseColor, strip.opacity);
    ctx.textBaseline = 'middle';

    if (dir === 'v') {
      // 垂直向下：计算每个item的y位置
      const x = W * posV + px;
      // 测量总高度（gap固定40px）
      const GAP = fontSize * 2.8;
      const totalH = looped.length * GAP;
      // progress → 起始y（从-totalH/2到0循环）
      const startY = -totalH * strip.progress + py;

      ctx.textAlign = 'center';
      looped.forEach((item, i) => {
        const y = startY + i * GAP;
        // 只画屏幕内的
        if (y > -GAP && y < H + GAP) {
          ctx.fillText(item.text, x, y);
        }
      });

    } else if (dir === 'h' || dir === 'd') {
      // 水平 / 斜角：沿x轴排列
      const y = H * posH + py;
      const GAP = fontSize * 2.2;

      // 测量最长文本宽，统一间距
      const totalW = looped.length * GAP * 5; // 估算，实际按文本宽叠加
      // 改用累积x
      let curX = -totalW * strip.progress + px + (dir==='d' ? W*posV : 0);
      if (dir === 'h') curX += 0;

      ctx.textAlign = 'left';
      looped.forEach((item) => {
        const tw = ctx.measureText(item.text).width + GAP;
        if (dir === 'h') {
          if (curX > -tw && curX < W + tw) {
            ctx.fillText(item.text, curX, y);
          }
        } else {
          // 斜角时相对旋转中心绘制
          const rx = curX - W * posV;
          if (rx > -W*1.5 && rx < W*1.5) {
            ctx.fillText(item.text, W*posV + rx, y);
          }
        }
        curX += tw;
      });
    }

    ctx.restore();
  });
}

// ═══════════════════════════════════════════════════════
// THREE.JS — 单字飘动
// ═══════════════════════════════════════════════════════
const N_ELEMENTS = 160;
const SPREAD = 12, SPEED = 0.22, BOB_HZ = 0.18, BOB_AMT = 0.10, ROT_MAX = 0.010;
let renderer, scene, camera, clock, meshes = [];

function makeTexture(tagged) {
  const { text, lang } = tagged;
  const cfg = LANG_CONFIG[lang];
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');

  const logicalSize = 32 + Math.floor(Math.random() * 24);
  const physSize = Math.round(logicalSize * DPR);
  const fontTpl = cfg.fonts[Math.floor(Math.random() * cfg.fonts.length)];
  const font = fontTpl.replace('{s}', physSize);

  ctx.font = font;
  const metrics = ctx.measureText(text);
  const tw = Math.ceil(metrics.width) + Math.ceil(physSize * 0.5);
  const th = Math.ceil(physSize * 1.5);
  c.width = Math.max(tw, 4);
  c.height = Math.max(th, 4);

  ctx.font = font;
  ctx.fillStyle = cfg.colors[Math.floor(Math.random() * cfg.colors.length)];
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, c.height / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return { tex, ratio: c.height / c.width };
}

// ═══════════════════════════════════════════════════════
// INPUT — 统一管理，Three.js和strips共享
// ═══════════════════════════════════════════════════════
function initInput() {
  const onDown = e => {
    pointerDown = true;
    const p = e.touches ? e.touches[0] : e;
    lastPX = p.clientX; lastPY = p.clientY;
  };
  const onUp = () => { pointerDown = false; };
  const onMove = e => {
    if (!pointerDown) return;
    const p = e.touches ? e.touches[0] : e;
    targetYaw   -= (p.clientX - lastPX) * 0.004;
    targetPitch -= (p.clientY - lastPY) * 0.002;
    targetPitch  = Math.max(-0.6, Math.min(0.6, targetPitch));
    targetYaw    = Math.max(-1.2, Math.min(1.2, targetYaw));
    lastPX = p.clientX; lastPY = p.clientY;
  };

  document.addEventListener('pointerdown', onDown);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
  document.addEventListener('pointermove', onMove);
  document.addEventListener('touchstart', onDown, { passive:true });
  document.addEventListener('touchend', onUp);
  document.addEventListener('touchmove', onMove, { passive:true });
}

// ═══════════════════════════════════════════════════════
// FONT LOAD
// ═══════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  try {
    await document.fonts.load('12px "Noto Serif SC"');
    document.getElementById('loading-msg').innerHTML =
      '语言漂浮在我们之间。<br>Language drifts between us.<br>Les langues dérivent entre nous.';
  } catch(e) {}
  document.getElementById('start-btn').style.display = 'block';
  document.getElementById('swipe-hint').style.display = 'block';
});

// ═══════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════
async function start() {
  document.getElementById('ui').style.display = 'none';

  initInput();
  initStrips();

  try {
    const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:'environment'} }, audio:false });
    document.getElementById('cam').srcObject = s;
  } catch(e) {}

  const canvas = document.getElementById('three-canvas');
  renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setPixelRatio(DPR);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 6);
  clock  = new THREE.Clock();

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    resizeStripsCanvas();
  });

  await document.fonts.ready;

  for (let i = 0; i < N_ELEMENTS; i++) {
    const tagged = TEXTS_TAGGED[i % TEXTS_TAGGED.length];
    const { tex, ratio } = makeTexture(tagged);

    const sizeVar = 0.4 + Math.random() * 0.9;
    const w = sizeVar * 1.4, h = w * ratio;
    const geo = new THREE.PlaneGeometry(w, h);
    const baseOpacity = 0.4 + Math.random() * 0.5;
    const mat = new THREE.MeshBasicMaterial({
      map:tex, transparent:true, depthWrite:false,
      side:THREE.DoubleSide, opacity:baseOpacity,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = Math.random();

    mesh.position.set(
      (Math.random()-0.5)*SPREAD*2,
      (Math.random()-0.5)*SPREAD,
      (Math.random()-0.5)*SPREAD*1.8
    );
    mesh.rotation.set(
      (Math.random()-0.5)*Math.PI*0.5,
      (Math.random()-0.5)*Math.PI*0.7,
      (Math.random()-0.5)*Math.PI*0.3
    );

    const angle = Math.random()*Math.PI*2;
    const spd = SPEED*(0.4+Math.random()*0.9);
    mesh.userData = {
      vx: Math.cos(angle)*spd, vz: (Math.random()-0.5)*spd*0.2,
      rx: (Math.random()-0.5)*2*ROT_MAX,
      ry: (Math.random()-0.5)*2*ROT_MAX*1.5,
      rz: (Math.random()-0.5)*2*ROT_MAX*0.6,
      bobPhase: Math.random()*Math.PI*2,
      bobRate:  0.6+Math.random()*0.8,
      baseY: mesh.position.y,
      wobblePhase: Math.random()*Math.PI*2,
      wobbleAmt:   (Math.random()-0.5)*0.06,
      baseOpacity,
    };
    scene.add(mesh);
    meshes.push(mesh);
  }

  animate();
}

// ═══════════════════════════════════════════════════════
// ANIMATE — Three.js + strips同步更新
// ═══════════════════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();
  const H  = SPREAD;

  // 平滑插值相机偏移
  dragYaw   += (targetYaw   - dragYaw)   * 0.07;
  dragPitch += (targetPitch - dragPitch) * 0.07;

  // 三维单字飘动
  meshes.forEach(m => {
    const d = m.userData;
    const wobble = Math.sin(t*0.4 + d.wobblePhase) * d.wobbleAmt;
    m.position.x += (d.vx + wobble) * dt;
    m.position.y  = d.baseY + Math.sin(t*BOB_HZ*d.bobRate*Math.PI*2 + d.bobPhase)*BOB_AMT;
    m.position.z += d.vz * dt;
    m.rotation.x += d.rx * dt * 60;
    m.rotation.y += d.ry * dt * 60;
    m.rotation.z += d.rz * dt * 60;

    const lim = H*2;
    if (m.position.x >  lim) { m.position.x=-lim; d.baseY=(Math.random()-0.5)*H; }
    if (m.position.x < -lim) { m.position.x= lim; d.baseY=(Math.random()-0.5)*H; }
    if (m.position.z >  H*2) m.position.z = -H*2;
    if (m.position.z < -H*2) m.position.z =  H*2;

    const depth = (m.position.z + H*1.5) / (H*3.0);
    m.material.opacity = Math.max(0.06, Math.min(0.92, d.baseOpacity*(0.3+depth*0.7)));
  });

  // 相机跟随（单字层视角）
  camera.rotation.y += (dragYaw   - camera.rotation.y) * 0.08;
  camera.rotation.x += (dragPitch - camera.rotation.x) * 0.08;

  renderer.render(scene, camera);

  // strips层：独立速度+parallax
  drawStrips(dt, t);
}
</script>
