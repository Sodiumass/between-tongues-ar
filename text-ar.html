<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Between Tongues</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#e8e4df; }
#cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
#three-canvas { position:fixed; inset:0; z-index:1; }


#ui {
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#f0ede8;
  color:#111; font-family:monospace;
  text-align:center; padding:48px; gap:10px;
}


#ui .sub { font-size:10px; color:#444; letter-spacing:0.22em; }
#ui h1   { font-size:16px; font-weight:normal; }
#ui p    { font-size:11px; color:#666; line-height:1.85; max-width:300px; }
#ui button {
  margin-top:20px; padding:13px 44px; background: linear-gradient(135deg, #E8503A 0%, #4A9EBF 50%, #8BBF3A 100%);
  color:#fff; border:none; font-family:monospace;
  font-size:14px; letter-spacing:0.18em; text-transform:uppercase; cursor:pointer;
}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="three-canvas"></canvas>

<div id="ui">
  
  <h1 style="font-size:32px; font-family:'Times New Roman', Times, serif;font-weight:500; letter-spacing:-0.01em; color:#111; line-height:1.3;">
    Lost and Found Between One Word and the Next
  </h1>

  <div style="font-size:16px; font-style:italic; color:#888; margin-top:2px; line-height:1.5;">
    Making Translanguaging Visible as Embodied Design Practice
  </div>

  <div style="width:32px; height:1px; background:#ccc; margin:16px auto;"></div>

  <div style="font-size:14px; color:#555; line-height:1.9; max-width:300px;">
    语言漂浮在我们之间。<br>
    Language drifts between us.<br>
    Les langues dérivent entre nous.
  </div>

  <div style="width:32px; height:1px; background:#ccc; margin:16px auto;"></div>

  <div style="font-size:16px; letter-spacing:0.18em; text-transform:uppercase; color:#656565; margin-top:8px;">
    Swipe to explore different angles
  </div>

  <button onclick="start()">Enter</button>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── TEXT CONTENT ─────────────────────────────────────────
const TEXTS = [
  // 单个中文字
  '说','听','语','言','我','你','他','间','字','声',
  '口','心','意','思','话','写','读','懂','找','失',
  '名','词','句','译','换','借','混','跨','界','边',
  // 偏旁部首
  '讠','口','耳','心','目','手','足','阝','氵','木',
  '人','女','子','门','言','页','纟','艹','钅','风',
  // 法语词
  'langue','dire','entre','mots','jamais',
  'parler','voix','perdre','trouver','sens',
  'silence','souffle','frontière','glisser',
  // 英语词
  'speak','hear','lost','found','between',
  'word','tongue','slip','drift','gap',
  'silence','breath','border','cross',
  // 音标
  '/ə/','/θ/','/tɕ/','/y/','/ʒ/',
  '/ɑ/','/œ/','/ɥ/','/ŋ/','/ʁ/',
  // 字母/符号散落
  'é','è','ü','ñ','ç','ô','â','î',
  'A','B','C','Q','Z','X',
  // 短句/片段
  '等等…','mais…','sorry…',
  'I mean','c\'est quoi','还是说',
  '怎么说','comment dire','how do I',
  '然后','et alors','and then',
  '不对','ce n\'est pas','that\'s not',
];

// ── CONFIG ───────────────────────────────────────────────
const N_ELEMENTS  = 120;   // total floating elements
const SPREAD      = 12;    // world space radius
const SPEED       = 0.22;  // drift speed
const BOB_HZ      = 0.18;
const BOB_AMT     = 0.10;
const ROT_MAX     = 0.010; // gentle tumble

// Color palette — coral / sky / lime / dark / mid
const COLORS = [
  '#E8503A','#E8503A','#E8503A',   // coral (weighted)
  '#4A9EBF','#4A9EBF','#4A9EBF',   // sky
  '#8BBF3A','#8BBF3A',             // lime
  '#111111','#111111','#333333',   // dark (most common)
  '#888888',                       // grey
];

const FONTS = [
  { f:'bold {s}px serif',       w:1 },
  { f:'italic {s}px serif',     w:1 },
  { f:'{s}px monospace',        w:1 },
  { f:'bold italic {s}px serif',w:0.5 },
  { f:'{s}px sans-serif',       w:0.5 },
];

// ── STATE ────────────────────────────────────────────────
let renderer, scene, camera, clock;
let meshes = [];
let dragYaw = 0, dragPitch = 0;
let pointerDown = false, lastPX = 0, lastPY = 0;

// ── MAKE TEXT TEXTURE ────────────────────────────────────
function makeTexture(text) {
  const c   = document.createElement('canvas');
  const ctx = c.getContext('2d');

  // pick font
  const fDef = FONTS[Math.floor(Math.random() * FONTS.length)];
  const size = 48 + Math.floor(Math.random() * 72); // 48–120px
  const font = fDef.f.replace('{s}', size);

  ctx.font = font;
  const metrics = ctx.measureText(text);
  const tw = Math.ceil(metrics.width) + 24;
  const th = Math.ceil(size * 1.4);

  c.width  = Math.max(tw, 2);
  c.height = Math.max(th, 2);

  // transparent background
  ctx.clearRect(0, 0, c.width, c.height);

  // color
  ctx.font      = font;
  ctx.fillStyle = COLORS[Math.floor(Math.random() * COLORS.length)];
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, c.height / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return { tex, ratio: c.height / c.width, text };
}

// ── START ────────────────────────────────────────────────
function start() {
  document.getElementById('ui').style.display = 'none';

  const canvas = document.getElementById('three-canvas');
  const isAndroid = /android/i.test(navigator.userAgent);

  renderer = new THREE.WebGLRenderer({
    canvas, alpha:true, antialias:true, powerPreference:'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, isAndroid ? 1.5 : 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0xf0ede8, 1); // warm white bg — no camera needed

  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 6);
  clock  = new THREE.Clock();

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  // drag
  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => { pointerDown=true; lastPX=e.clientX; lastPY=e.clientY; });
  window.addEventListener('pointerup',     () => pointerDown=false);
  window.addEventListener('pointercancel', () => pointerDown=false);
  window.addEventListener('pointermove', e => {
    if (!pointerDown) return;
    dragYaw   -= (e.clientX - lastPX) * 0.004;
    dragPitch -= (e.clientY - lastPY) * 0.002;
    dragPitch  = Math.max(-0.5, Math.min(0.5, dragPitch));
    lastPX = e.clientX; lastPY = e.clientY;
  });

  // spawn elements
  for (let i = 0; i < N_ELEMENTS; i++) {
    const text = TEXTS[i % TEXTS.length];
    const { tex, ratio } = makeTexture(text);

    const sizeVar = 0.5 + Math.random() * 1.0;
    const w = sizeVar * 1.4;
    const h = w * ratio;

    const geo = new THREE.PlaneGeometry(w, h);
    const mat = new THREE.MeshBasicMaterial({
      map: tex, transparent:true, depthWrite:false,
      side: THREE.DoubleSide,
      opacity: 0.55 + Math.random() * 0.45,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = Math.random();

    // position
    mesh.position.set(
      (Math.random()-0.5) * SPREAD * 2,
      (Math.random()-0.5) * SPREAD,
      (Math.random()-0.5) * SPREAD * 1.8
    );

    // initial tilt — not all facing camera
    mesh.rotation.set(
      (Math.random()-0.5) * Math.PI * 0.5,
      (Math.random()-0.5) * Math.PI * 0.7,
      (Math.random()-0.5) * Math.PI * 0.3
    );

    // drift
    const angle = Math.random() * Math.PI * 2;
    const spd   = SPEED * (0.4 + Math.random() * 0.9);
    const baseOpacity = 0.55 + Math.random() * 0.45;

    mesh.userData = {
      vx: Math.cos(angle) * spd,
      vy: (Math.random()-0.5) * spd * 0.3,
      vz: (Math.random()-0.5) * spd * 0.2,
      rx: (Math.random()-0.5) * 2 * ROT_MAX,
      ry: (Math.random()-0.5) * 2 * ROT_MAX * 1.5,
      rz: (Math.random()-0.5) * 2 * ROT_MAX * 0.6,
      bobPhase: Math.random() * Math.PI * 2,
      bobRate:  0.6 + Math.random() * 0.8,
      baseY:    mesh.position.y,
      wobblePhase: Math.random() * Math.PI * 2,
      wobbleAmt:   (Math.random()-0.5) * 0.06,
      baseOpacity,
    };
    mat.opacity = baseOpacity;

    scene.add(mesh);
    meshes.push(mesh);
  }

  animate();
}

// ── ANIMATE ──────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();
  const H  = SPREAD;

  meshes.forEach(m => {
    const d = m.userData;
    const wobble = Math.sin(t * 0.4 + d.wobblePhase) * d.wobbleAmt;

    m.position.x += (d.vx + wobble) * dt;
    m.position.y  = d.baseY + Math.sin(t * BOB_HZ * d.bobRate * Math.PI*2 + d.bobPhase) * BOB_AMT;
    m.position.z += d.vz * dt;

    m.rotation.x += d.rx * dt * 60;
    m.rotation.y += d.ry * dt * 60;
    m.rotation.z += d.rz * dt * 60;

    const lim = H * 2;
    if (m.position.x >  lim) { m.position.x = -lim; d.baseY = (Math.random()-0.5)*H; }
    if (m.position.x < -lim) { m.position.x =  lim; d.baseY = (Math.random()-0.5)*H; }
    if (m.position.z >  H*2) m.position.z = -H*2;
    if (m.position.z < -H*2) m.position.z =  H*2;

    const depth = (m.position.z + H*1.5) / (H*3.0);
    m.material.opacity = Math.max(0.08, Math.min(0.95, d.baseOpacity * (0.35 + depth * 0.65)));
  });

  camera.rotation.y += (dragYaw   - camera.rotation.y) * 0.08;
  camera.rotation.x += (dragPitch - camera.rotation.x) * 0.08;

  renderer.render(scene, camera);
}
</script>
</body>
</html>
