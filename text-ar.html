<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Between Tongues</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#e8e4df; }
#cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
#three-canvas { position:fixed; inset:0; z-index:1; }

  font-size:14px; letter-spacing:0.18em; text-transform:uppercase;

</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="three-canvas"></canvas>
<canvas id="strips-canvas"></canvas>

<div id="ui">
  <h1 style="font-size:32px; font-family:'Times New Roman',serif; font-weight:500; letter-spacing:-0.01em; color:#111; line-height:1.3;">
    Lost and Found Between One Word and the Next
  </h1>
  <div style="font-size:16px; font-style:italic; color:#888; margin-top:2px; line-height:1.5;">
    Making Translanguaging Visible as Embodied Design Practice
  </div>
  <div style="width:32px; height:1px; background:#ccc; margin:16px auto;"></div>
  <div id="loading-msg" style="font-size:14px; color:#555; line-height:1.9; max-width:300px;">
    正在加载思源宋体…<br>Loading fonts…
  </div>
  <button id="start-btn" onclick="start()" style="display:none;">Enter</button>
  <div id="swipe-hint" style="display:none; font-size:13px; letter-spacing:0.15em; text-transform:uppercase; color:#888; margin-top:8px;">
    Swipe to explore
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

const DPR = Math.min(window.devicePixelRatio || 1, 2);

// ═══════════════════════════════════════════════════════
// CONTENT
// ═══════════════════════════════════════════════════════

const WORDS_ZH = [
  '说','听','语','言','我','你','他','间','字','声','口','心','意','思','话',
  '写','读','懂','找','失','名','词','句','译','换','借','混','跨','界','边',
  '沉','默','漂','流','根','土','乡','异','归','离','脑','舌','喉','气','息',
  '音','调','腔','韵','讠','耳','目','手','足','氵','木','人','女','门',
];
const SENTENCES_ZH = [
  '等等…','还是说','怎么说','然后','不对',
  '我不知道怎么翻译','这个词只有中文有',
  '你懂我的意思吗','说不出来','忘词了',
  '在哪一种语言里','我才是我自己',
  '妈妈的语言','学校的语言','梦里的语言',
  '两种语言之间的沉默','有些话只能用这个说',
  '我在两种语言之间长大',
  '翻译不了的感觉','心里想的是中文',
  '说出来变成了别的','语言在喉咙里打架',
  '我用哪种语言哭','我用哪种语言笑',
  '名字被叫错的感觉',
];
const WORDS_FR = [
  'langue','dire','entre','mots','jamais','parler','voix','perdre','trouver',
  'sens','silence','souffle','frontière','glisser','appartenir','mémoire',
  'accent','traduire','manquer','chercher','habiter','corps','racine','dérive',
  'passage','seuil','identité','nommer','résonner','naviguer',
  'é','è','ê','à','â','ç','œ','ô','î','ï',
];
const SENTENCES_FR = [
  'mais…','c\'est quoi','comment dire',
  'et alors','ce n\'est pas ça',
  'je cherche mes mots','tu comprends?',
  'comment expliquer','c\'est différent',
  'dans quelle langue je rêve',
  'je me perds entre les deux',
  'le mot exact n\'existe pas',
  'une langue que j\'habite à moitié',
  'glisser d\'une langue à l\'autre',
  'ma voix change selon la langue',
  'les mots me manquent',
  'je ne suis pas la même personne',
  'quelque chose se perd','quelque chose reste',
];
const WORDS_EN = [
  'speak','hear','lost','found','between','word','tongue','slip','drift','gap',
  'silence','breath','border','cross','belong','memory','accent','translate',
  'switch','code','hybrid','fluid','root','echo','trace','hold','inherit',
  'navigate','rupture','carry',
  '/ə/','/θ/','/tɕ/','/y/','/ʒ/','/ɑ/','/œ/','/ɥ/','/ŋ/','/ʁ/',
  'A','B','Q','Z','X',
];
const SENTENCES_EN = [
  'sorry…','I mean','how do I say',
  'and then','that\'s not what I meant',
  'I think better in—','wait, in which language',
  'the word doesn\'t exist in English',
  'I grew up between','lost in translation',
  'which version of me are you talking to',
  'my accent gives me away',
  'I dream in more than one language',
  'something gets lost','something stays',
  'a different self in every language',
  'what doesn\'t translate',
  'neither here nor there',
  'the language I inherited',
  'code-switching in my sleep',
  'the gap between','the in-between',
];

// Three.js 单字层
const TEXTS_TAGGED = [
  ...WORDS_ZH.map(t=>({text:t,lang:'zh'})),
  ...WORDS_FR.map(t=>({text:t,lang:'fr'})),
  ...WORDS_EN.map(t=>({text:t,lang:'en'})),
];

// ═══════════════════════════════════════════════════════
// LANG CONFIG
// ═══════════════════════════════════════════════════════
const SERIF_ZH = '"Noto Serif SC","STSong","华文宋体","SimSun","宋体",serif';

const LANG_CONFIG = {
  zh: {
    floatFonts: [`{s}px ${SERIF_ZH}`, `bold {s}px ${SERIF_ZH}`],
    floatColors: ['#e84545','#d63a3a','#f05555','#c93030','#e86060','#bf2a2a'],
    stripFont: (sz) => `${sz}px ${SERIF_ZH}`,
  },
  fr: {
    floatFonts: [`italic {s}px "Georgia",serif`, `italic {s}px "Times New Roman",serif`],
    floatColors: ['#4a8fd9','#3a7ec8','#5a9fe8','#2d72bb','#6aaee8','#1f5fa0'],
    stripFont: (sz) => `italic ${sz}px "Georgia","Times New Roman",serif`,
  },
  en: {
    floatFonts: [`{s}px "Courier Prime",monospace`, `bold {s}px "Courier Prime",monospace`,
                 `italic {s}px "Courier Prime",monospace`],
    floatColors: ['#8fcc3b','#7db82e','#9fd948','#6aa022','#aad960','#5a8c18'],
    stripFont: (sz) => `${sz}px "Courier Prime","Courier New",monospace`,
  },
};

// ═══════════════════════════════════════════════════════
// SHARED INPUT STATE
// ═══════════════════════════════════════════════════════
let targetYaw = 0, targetPitch = 0;
let dragYaw   = 0, dragPitch   = 0;
let pointerDown = false, lastPX = 0, lastPY = 0;

function initInput() {
  const onDown = e => {
    pointerDown = true;
    const p = e.touches ? e.touches[0] : e;
    lastPX = p.clientX; lastPY = p.clientY;
  };
  const onUp = () => { pointerDown = false; };
  const onMove = e => {
    if (!pointerDown) return;
    const p = e.touches ? e.touches[0] : e;
    targetYaw   -= (p.clientX - lastPX) * 0.004;
    targetPitch -= (p.clientY - lastPY) * 0.002;
    targetPitch = Math.max(-0.6, Math.min(0.6, targetPitch));
    targetYaw   = Math.max(-1.4, Math.min(1.4, targetYaw));
    lastPX = p.clientX; lastPY = p.clientY;
  };
  document.addEventListener('pointerdown',  onDown);
  document.addEventListener('pointerup',    onUp);
  document.addEventListener('pointercancel',onUp);
  document.addEventListener('pointermove',  onMove);
  document.addEventListener('touchstart',  onDown, { passive:true });
  document.addEventListener('touchend',    onUp);
  document.addEventListener('touchmove',   onMove, { passive:true });
}

// ═══════════════════════════════════════════════════════
// STRIP SYSTEM
// 全部用 canvas 2D 手绘，上下左右方向，无斜角
// offset 以像素为单位实时累加，保证真实滚动速度
// ═══════════════════════════════════════════════════════
let sc, sctx;    // strips canvas + context
const strips = [];

function r(a,b){ return a + Math.random()*(b-a); }
function ri(a,b){ return Math.floor(r(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickN(arr, n){
  const out=[];
  for(let i=0;i<n;i++) out.push(arr[Math.floor(Math.random()*arr.length)]);
  return out;
}

// 灰色palette（不含彩色，strips专用）
const GRAYS = ['#1c1c1c','#2e2e2e','#404040','#555','#686868','#7a7a7a','#8c8c8c','#9e9e9e'];

function initStrips() {
  sc  = document.getElementById('strips-canvas');
  sctx = sc.getContext('2d');
  resizeSC();

  const W = window.innerWidth;
  const H = window.innerHeight;

  // 所有短句混合打散
  const pool = [
    ...SENTENCES_ZH.map(t=>({text:t,lang:'zh'})),
    ...SENTENCES_FR.map(t=>({text:t,lang:'fr'})),
    ...SENTENCES_EN.map(t=>({text:t,lang:'en'})),
  ].sort(()=>Math.random()-0.5);

  // ── 垂直列（向下）──────────────────────────────────
  // 放在屏幕左右两侧，留出中间给三维单字
  const V_COLS = [
    { xFrac:0.04,  fontSize:11, opacity:r(0.18,0.30), speedPx:28 },
    { xFrac:0.14,  fontSize:14, opacity:r(0.22,0.38), speedPx:20 },
    { xFrac:0.88,  fontSize:12, opacity:r(0.15,0.28), speedPx:34 },
    { xFrac:0.96,  fontSize:10, opacity:r(0.12,0.22), speedPx:24 },
  ];
  V_COLS.forEach((col, i) => {
    const lang = pick(['zh','zh','fr','en']);
    const sentences = pickN(pool.filter(s=>s.lang===lang).length ? pool.filter(s=>s.lang===lang) : pool, 10);
    // 重复 3 遍保证足够长度
    const items = [...sentences,...sentences,...sentences];
    strips.push({
      dir: 'v',
      x: col.xFrac * W,
      fontSize: col.fontSize,
      opacity: col.opacity,
      speedPx: col.speedPx,   // px/s
      items,
      lang,
      offset: r(0, 1),        // 初始相位 0–1（占total高度比例）
      // parallax
      pxCoeff: r(0.04, 0.12) * (Math.random()>0.5?1:-1),
      pyCoeff: r(0.02, 0.08) * (Math.random()>0.5?1:-1),
    });
  });

  // ── 水平行（向右）──────────────────────────────────
  const H_ROWS = [
    { yFrac:0.08,  fontSize:12, opacity:r(0.18,0.32), speedPx:22 },
    { yFrac:0.28,  fontSize:10, opacity:r(0.12,0.22), speedPx:16 },
    { yFrac:0.72,  fontSize:13, opacity:r(0.20,0.35), speedPx:26 },
    { yFrac:0.92,  fontSize:11, opacity:r(0.14,0.26), speedPx:19 },
  ];
  H_ROWS.forEach((row, i) => {
    const lang = pick(['fr','fr','en','zh']);
    const sentences = pickN(pool.filter(s=>s.lang===lang).length ? pool.filter(s=>s.lang===lang) : pool, 12);
    const items = [...sentences,...sentences,...sentences];
    strips.push({
      dir: 'h',
      y: row.yFrac * H,
      fontSize: row.fontSize,
      opacity: row.opacity,
      speedPx: row.speedPx,
      items,
      lang,
      offset: r(0, 1),
      pxCoeff: r(0.03, 0.10) * (Math.random()>0.5?1:-1),
      pyCoeff: r(0.03, 0.08) * (Math.random()>0.5?1:-1),
    });
  });

  // 为每条strip预测量item宽/高，避免每帧重复计算
  strips.forEach(s => {
    sctx.font = LANG_CONFIG[s.lang].stripFont(s.fontSize);
    if (s.dir === 'v') {
      s.lineH = s.fontSize * 2.6;           // 行高（含间距）
      s.totalLen = s.items.length * s.lineH; // 总高度px
      s.offsetPx = s.offset * s.totalLen;   // 初始像素偏移
    } else {
      s.itemWidths = s.items.map(item => sctx.measureText(item.text).width + s.fontSize * 2.4);
      s.totalLen = s.itemWidths.reduce((a,b)=>a+b, 0);
      s.offsetPx = s.offset * s.totalLen;
    }
  });
}

function resizeSC() {
  sc.width  = window.innerWidth  * DPR;
  sc.height = window.innerHeight * DPR;
  sc.style.width  = window.innerWidth  + 'px';
  sc.style.height = window.innerHeight + 'px';
}

function hexRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

function drawStrips(dt) {
  const W = window.innerWidth;
  const H = window.innerHeight;

  sctx.save();
  sctx.scale(DPR, DPR);
  sctx.clearRect(0, 0, W, H);

  // 当前平滑相机偏移（逻辑像素）
  const camX = dragYaw   * W * 0.18;
  const camY = dragPitch * H * 0.15;

  strips.forEach(s => {
    // 推进偏移（px/s * dt = px）
    s.offsetPx += s.speedPx * dt;
    if (s.offsetPx >= s.totalLen) s.offsetPx -= s.totalLen;

    // parallax：每条strip的位移系数不同，造成层次感
    const px = camX * s.pxCoeff;
    const py = camY * s.pyCoeff;

    // 取灰色（不是红绿蓝）
    const gray = pick(GRAYS);
    const [r,g,b] = hexRgb(gray);

    sctx.save();
    sctx.font = LANG_CONFIG[s.lang].stripFont(s.fontSize);
    sctx.textBaseline = 'middle';

    if (s.dir === 'v') {
      const x = s.x + px;
      sctx.textAlign = 'center';
      // 从 -offsetPx 开始往下画，超出屏幕就用 mod 循环
      let y = -s.offsetPx + py;
      // 找到第一个可见的item
      while (y < -s.lineH) y += s.totalLen;
      let idx = 0;
      while (y < H + s.lineH) {
        const item = s.items[idx % s.items.length];
        // 近屏幕中心的item稍微清晰一点（简单distance fade）
        const distCenter = Math.abs(y - H/2) / (H/2);
        const alpha = s.opacity * (1 - distCenter * 0.4);
        sctx.fillStyle = `rgba(${r},${g},${b},${Math.max(0.04, alpha)})`;
        sctx.fillText(item.text, x, y);
        y += s.lineH;
        idx++;
        if (idx > s.items.length * 4) break; // 安全截断
      }

    } else {
      // 水平
      const y = s.y + py;
      sctx.textAlign = 'left';
      let x = -s.offsetPx + px;
      while (x < -s.itemWidths[0]) x += s.totalLen;
      let idx = 0;
      while (x < W + 200) {
        const iw = s.itemWidths[idx % s.itemWidths.length];
        const item = s.items[idx % s.items.length];
        const distCenter = Math.abs(x + iw/2 - W/2) / (W/2);
        const alpha = s.opacity * (1 - distCenter * 0.35);
        sctx.fillStyle = `rgba(${r},${g},${b},${Math.max(0.04, alpha)})`;
        sctx.fillText(item.text, x, y);
        x += iw;
        idx++;
        if (idx > s.items.length * 4) break;
      }
    }

    sctx.restore();
  });

  sctx.restore();
}

// ═══════════════════════════════════════════════════════
// THREE.JS — 单字飘动
// ═══════════════════════════════════════════════════════
const N_ELEMENTS = 160;
const SPREAD = 12, FLOAT_SPEED = 0.22, BOB_HZ = 0.18, BOB_AMT = 0.10, ROT_MAX = 0.010;
let renderer, scene, camera, clock;
let meshes = [];

function makeTexture(tagged) {
  const { text, lang } = tagged;
  const cfg = LANG_CONFIG[lang];
  const c   = document.createElement('canvas');
  const ctx = c.getContext('2d');

  const logicalSize = 32 + Math.floor(Math.random() * 24);
  const physSize    = Math.round(logicalSize * DPR);
  const fontTpl     = cfg.floatFonts[Math.floor(Math.random() * cfg.floatFonts.length)];
  const font        = fontTpl.replace('{s}', physSize);

  ctx.font = font;
  const metrics = ctx.measureText(text);
  const tw = Math.ceil(metrics.width) + Math.ceil(physSize * 0.5);
  const th = Math.ceil(physSize * 1.5);
  c.width  = Math.max(tw, 4);
  c.height = Math.max(th, 4);

  ctx.font         = font;
  ctx.fillStyle    = cfg.floatColors[Math.floor(Math.random() * cfg.floatColors.length)];
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width/2, c.height/2);

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return { tex, ratio: c.height / c.width };
}

// ═══════════════════════════════════════════════════════
// FONT LOAD
// ═══════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  try {
    await document.fonts.load('12px "Noto Serif SC"');
    document.getElementById('loading-msg').innerHTML =
      '语言漂浮在我们之间。<br>Language drifts between us.<br>Les langues dérivent entre nous.';
  } catch(e) {}
  document.getElementById('start-btn').style.display  = 'block';
  document.getElementById('swipe-hint').style.display = 'block';
});

// ═══════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════
async function start() {
  document.getElementById('ui').style.display = 'none';

  initInput();
  initStrips();

  try {
    const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:'environment'} }, audio:false });
    document.getElementById('cam').srcObject = s;
  } catch(e) {}

  const canvas = document.getElementById('three-canvas');
  renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setPixelRatio(DPR);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 6);
  clock  = new THREE.Clock();

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    resizeSC();
  });

  await document.fonts.ready;

  for (let i = 0; i < N_ELEMENTS; i++) {
    const tagged = TEXTS_TAGGED[i % TEXTS_TAGGED.length];
    const { tex, ratio } = makeTexture(tagged);

    const sizeVar = 0.4 + Math.random() * 0.9;
    const w = sizeVar * 1.4, h = w * ratio;
    const geo = new THREE.PlaneGeometry(w, h);
    const baseOpacity = 0.4 + Math.random() * 0.5;
    const mat = new THREE.MeshBasicMaterial({
      map:tex, transparent:true, depthWrite:false,
      side:THREE.DoubleSide, opacity:baseOpacity,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = Math.random();

    mesh.position.set(
      (Math.random()-0.5)*SPREAD*2,
      (Math.random()-0.5)*SPREAD,
      (Math.random()-0.5)*SPREAD*1.8
    );
    mesh.rotation.set(
      (Math.random()-0.5)*Math.PI*0.5,
      (Math.random()-0.5)*Math.PI*0.7,
      (Math.random()-0.5)*Math.PI*0.3
    );

    const angle = Math.random()*Math.PI*2;
    const spd   = FLOAT_SPEED*(0.4+Math.random()*0.9);
    mesh.userData = {
      vx: Math.cos(angle)*spd,
      vz: (Math.random()-0.5)*spd*0.2,
      rx: (Math.random()-0.5)*2*ROT_MAX,
      ry: (Math.random()-0.5)*2*ROT_MAX*1.5,
      rz: (Math.random()-0.5)*2*ROT_MAX*0.6,
      bobPhase:    Math.random()*Math.PI*2,
      bobRate:     0.6+Math.random()*0.8,
      baseY:       mesh.position.y,
      wobblePhase: Math.random()*Math.PI*2,
      wobbleAmt:   (Math.random()-0.5)*0.06,
      baseOpacity,
    };
    scene.add(mesh);
    meshes.push(mesh);
  }

  animate();
}

// ═══════════════════════════════════════════════════════
// ANIMATE
// ═══════════════════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();
  const H  = SPREAD;

  // 平滑插值
  dragYaw   += (targetYaw   - dragYaw)   * 0.07;
  dragPitch += (targetPitch - dragPitch) * 0.07;

  // 单字飘动
  meshes.forEach(m => {
    const d = m.userData;
    const wobble = Math.sin(t*0.4 + d.wobblePhase) * d.wobbleAmt;
    m.position.x += (d.vx + wobble) * dt;
    m.position.y  = d.baseY + Math.sin(t*BOB_HZ*d.bobRate*Math.PI*2 + d.bobPhase)*BOB_AMT;
    m.position.z += d.vz * dt;
    m.rotation.x += d.rx * dt * 60;
    m.rotation.y += d.ry * dt * 60;
    m.rotation.z += d.rz * dt * 60;

    const lim = H*2;
    if (m.position.x >  lim) { m.position.x=-lim; d.baseY=(Math.random()-0.5)*H; }
    if (m.position.x < -lim) { m.position.x= lim; d.baseY=(Math.random()-0.5)*H; }
    if (m.position.z >  H*2) m.position.z = -H*2;
    if (m.position.z < -H*2) m.position.z =  H*2;

    const depth = (m.position.z + H*1.5) / (H*3.0);
    m.material.opacity = Math.max(0.06, Math.min(0.92, d.baseOpacity*(0.3+depth*0.7)));
  });

  // 相机跟随
  camera.rotation.y += (dragYaw   - camera.rotation.y) * 0.08;
  camera.rotation.x += (dragPitch - camera.rotation.x) * 0.08;
  renderer.render(scene, camera);

  // strips
  drawStrips(dt);
}
</script>
</body>
</html>
