<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Between Tongues</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:#e8e4df; }

#cam {
  position:fixed; inset:0; width:100%; height:100%;
  object-fit:cover; z-index:0;
}
#three-canvas {
  position:fixed; inset:0; z-index:1;
}

/* ── STRIPS LAYER ───────────────────────────────────── */
#strips-layer {
  position:fixed; inset:0; z-index:2;
  pointer-events:none; overflow:hidden;
}

/* 垂直向下滚动的strip */
.strip-v {
  position:absolute;
  top:0;
  display:flex;
  flex-direction:column;
  gap:48px;
  white-space:nowrap;
  animation: scrollDown linear infinite;
}
@keyframes scrollDown {
  from { transform: translateY(-50%); }
  to   { transform: translateY(0%); }
}

/* 水平向右滚动的strip */
.strip-h {
  position:absolute;
  left:0;
  display:flex;
  flex-direction:row;
  gap:72px;
  align-items:center;
  white-space:nowrap;
  animation: scrollRight linear infinite;
}
@keyframes scrollRight {
  from { transform: translateX(-50%); }
  to   { transform: translateX(0%); }
}

/* 斜角strip — 用rotate包裹 */
.strip-d-wrap {
  position:absolute;
  left:-40%;
  width:180%;
  transform-origin:center center;
}
.strip-d {
  display:flex;
  flex-direction:row;
  gap:64px;
  align-items:center;
  white-space:nowrap;
  animation: scrollRight linear infinite;
}

/* strip内单个句子 */
.strip-sentence {
  opacity:1;
  line-height:1;
  user-select:none;
}

/* ── UI SPLASH ──────────────────────────────────────── */
#ui {
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:#f0ede8;
  color:#111; font-family:serif;
  text-align:center; padding:48px; gap:10px;
}
#ui button {
  margin-top:20px; padding:13px 44px;
  background: linear-gradient(135deg, #E8503A 0%, #4A9EBF 50%, #8BBF3A 100%);
  color:#fff; border:none; font-family:monospace;
  font-size:14px; letter-spacing:0.18em; text-transform:uppercase;
  cursor:pointer; border-radius:4px;
}
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="three-canvas"></canvas>
<div id="strips-layer"></div>

<div id="ui">
  <h1 style="font-size:32px; font-family:'Times New Roman',serif; font-weight:500; letter-spacing:-0.01em; color:#111; line-height:1.3;">
    Lost and Found Between One Word and the Next
  </h1>
  <div style="font-size:16px; font-style:italic; color:#888; margin-top:2px; line-height:1.5;">
    Making Translanguaging Visible as Embodied Design Practice
  </div>
  <div style="width:32px; height:1px; background:#ccc; margin:16px auto;"></div>
  <div id="loading-msg" style="font-size:14px; color:#555; line-height:1.9; max-width:300px;">
    正在加载思源宋体…<br>Loading fonts…
  </div>
  <button id="start-btn" onclick="start()" style="display:none;">Enter</button>
  <div id="swipe-hint" style="display:none; font-size:14px; letter-spacing:0.18em; text-transform:uppercase; color:#656565; margin-top:8px;">
    Swipe to explore different angles
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const DPR = Math.min(window.devicePixelRatio || 1, 2);

// ═══════════════════════════════════════════════════════
// TEXT CONTENT
// 短句 (isSentence = text.length > 5) → strips层
// 单字/词/音标 → Three.js飘动层
// ═══════════════════════════════════════════════════════

const WORDS_ZH = [
  '说','听','语','言','我','你','他','间','字','声','口','心','意','思','话',
  '写','读','懂','找','失','名','词','句','译','换','借','混','跨','界','边',
  '沉','默','漂','流','根','土','乡','异','归','离','脑','舌','喉','气','息',
  '音','调','腔','韵','换',
  '讠','耳','目','手','足','氵','木','人','女','门',
];
const SENTENCES_ZH = [
  '等等…','还是说','怎么说','然后','不对',
  '我不知道怎么翻译','这个词只有中文有',
  '你懂我的意思吗','说不出来','忘词了',
  '在哪一种语言里','我才是我自己',
  '妈妈的语言','学校的语言','梦里的语言',
  '两种语言之间的沉默','有些话只能用这个说',
  '我在两种语言之间长大',
  '翻译不了的感觉','心里想的是中文',
  '说出来变成了别的','语言在喉咙里打架',
  '我用哪种语言哭','我用哪种语言笑',
  '名字被叫错的感觉',
];

const WORDS_FR = [
  'langue','dire','entre','mots','jamais','parler','voix','perdre','trouver',
  'sens','silence','souffle','frontière','glisser','appartenir','mémoire',
  'accent','traduire','manquer','chercher','habiter','corps','racine','dérive',
  'passage','seuil','identité','nommer','résonner','naviguer',
  'é','è','ê','à','â','ç','œ','ô','î','ï',
];
const SENTENCES_FR = [
  'mais…','c\'est quoi','comment dire',
  'et alors','ce n\'est pas ça',
  'je cherche mes mots','tu comprends?',
  'comment expliquer','c\'est différent',
  'dans quelle langue je rêve',
  'je me perds entre les deux',
  'le mot exact n\'existe pas',
  'une langue que j\'habite à moitié',
  'glisser d\'une langue à l\'autre',
  'ma voix change selon la langue',
  'les mots me manquent',
  'je ne suis pas la même personne',
  'quelque chose se perd','quelque chose reste',
];

const WORDS_EN = [
  'speak','hear','lost','found','between','word','tongue','slip','drift','gap',
  'silence','breath','border','cross','belong','memory','accent','translate',
  'switch','code','hybrid','fluid','root','echo','trace','hold','inherit',
  'navigate','rupture','carry',
  '/ə/','/θ/','/tɕ/','/y/','/ʒ/','/ɑ/','/œ/','/ɥ/','/ŋ/','/ʁ/',
  'A','B','Q','Z','X',
];
const SENTENCES_EN = [
  'sorry…','I mean','how do I say',
  'and then','that\'s not what I meant',
  'I think better in—','wait, in which language',
  'the word doesn\'t exist in English',
  'I grew up between','lost in translation',
  'which version of me are you talking to',
  'my accent gives me away',
  'I dream in more than one language',
  'something gets lost','something stays',
  'a different self in every language',
  'what doesn\'t translate',
  'neither here nor there',
  'the language I inherited',
  'code-switching in my sleep',
  'the gap between','the in-between',
];

// Three.js飘动层只用单字/词
const TEXTS_TAGGED = [
  ...WORDS_ZH.map(t => ({ text:t, lang:'zh' })),
  ...WORDS_FR.map(t => ({ text:t, lang:'fr' })),
  ...WORDS_EN.map(t => ({ text:t, lang:'en' })),
];

// ═══════════════════════════════════════════════════════
// LANGUAGE CONFIG
// ═══════════════════════════════════════════════════════
const SERIF_ZH = '"Noto Serif SC","STSong","华文宋体","SimSun","宋体",serif';

const LANG_CONFIG = {
  zh: {
    fonts: [`{s}px ${SERIF_ZH}`, `bold {s}px ${SERIF_ZH}`],
    colors: ['#e84545','#d63a3a','#f05555','#c93030','#e86060','#bf2a2a','#f07070'],
    // strip样式
    stripFont: `"Noto Serif SC","STSong","SimSun","宋体",serif`,
    stripSizes: [13, 15, 17],
    stripColors: ['#e84545','#d63a3a','#c93030','#f05555'],
  },
  fr: {
    fonts: [`italic {s}px "Georgia",serif`, `italic {s}px "Times New Roman",serif`],
    colors: ['#4a8fd9','#3a7ec8','#5a9fe8','#2d72bb','#6aaee8','#1f5fa0','#7bbcf0'],
    stripFont: `italic "Georgia","Times New Roman",serif`,
    stripSizes: [13, 15, 17],
    stripColors: ['#4a8fd9','#3a7ec8','#2d72bb','#5a9fe8'],
  },
  en: {
    fonts: [`{s}px "Courier Prime",monospace`, `bold {s}px "Courier Prime",monospace`],
    colors: ['#8fcc3b','#7db82e','#9fd948','#6aa022','#aad960','#5a8c18','#b8e655'],
    stripFont: `"Courier Prime","Courier New",monospace`,
    stripSizes: [12, 14, 16],
    stripColors: ['#8fcc3b','#7db82e','#6aa022','#9fd948'],
  },
};

// ═══════════════════════════════════════════════════════
// STRIP BUILDER
// direction: 'v' (down) | 'h' (right) | 'd' (diagonal)
// ═══════════════════════════════════════════════════════

function buildStrips() {
  const layer = document.getElementById('strips-layer');
  const W = window.innerWidth;
  const H = window.innerHeight;

  // 定义strip集合：每条strip的配置
  // 语言分配：中文多垂直，法语多斜角，英文多水平
  const STRIP_DEFS = [
    // ── 垂直向下 ─────────────────────────────────
    { lang:'zh', dir:'v', sentences: pick(SENTENCES_ZH, 8),  left: W*0.08,  dur:28, fontSize:14 },
    { lang:'zh', dir:'v', sentences: pick(SENTENCES_ZH, 7),  left: W*0.22,  dur:34, fontSize:13 },
    { lang:'en', dir:'v', sentences: pick(SENTENCES_EN, 6),  left: W*0.78,  dur:31, fontSize:13 },
    { lang:'fr', dir:'v', sentences: pick(SENTENCES_FR, 6),  left: W*0.91,  dur:26, fontSize:14 },

    // ── 水平向右 ─────────────────────────────────
    { lang:'en', dir:'h', sentences: pick(SENTENCES_EN, 10), top:  H*0.12,  dur:40, fontSize:13 },
    { lang:'en', dir:'h', sentences: pick(SENTENCES_EN, 8),  top:  H*0.88,  dur:48, fontSize:12 },
    { lang:'zh', dir:'h', sentences: pick(SENTENCES_ZH, 9),  top:  H*0.55,  dur:44, fontSize:14 },

    // ── 斜角 ─────────────────────────────────────
    { lang:'fr', dir:'d', sentences: pick(SENTENCES_FR, 10), top:  H*0.28, deg: -12, dur:52, fontSize:14 },
    { lang:'fr', dir:'d', sentences: pick(SENTENCES_FR, 9),  top:  H*0.65, deg:  10, dur:46, fontSize:13 },
    { lang:'zh', dir:'d', sentences: pick(SENTENCES_ZH, 8),  top:  H*0.42, deg:  -8, dur:58, fontSize:13 },
    { lang:'en', dir:'d', sentences: pick(SENTENCES_EN, 9),  top:  H*0.75, deg:  14, dur:50, fontSize:12 },
  ];

  STRIP_DEFS.forEach((def, i) => {
    const cfg = LANG_CONFIG[def.lang];
    const color = cfg.stripColors[i % cfg.stripColors.length];
    const fontStr = `${def.fontSize}px ${cfg.stripFont}`;
    // 短句重复两遍使循环无缝
    const repeated = [...def.sentences, ...def.sentences];

    if (def.dir === 'v') {
      const strip = document.createElement('div');
      strip.className = 'strip-v';
      strip.style.left = def.left + 'px';
      strip.style.animationDuration = def.dur + 's';
      // 随机offset让strip不全从同一位置开始
      strip.style.animationDelay = -(Math.random() * def.dur) + 's';

      repeated.forEach(txt => {
        const el = document.createElement('div');
        el.className = 'strip-sentence';
        el.textContent = txt;
        el.style.font = fontStr;
        el.style.color = color;
        el.style.writingMode = 'vertical-rl'; // 垂直排列中文更自然
        el.style.textOrientation = 'mixed';
        strip.appendChild(el);
      });
      layer.appendChild(strip);

    } else if (def.dir === 'h') {
      const strip = document.createElement('div');
      strip.className = 'strip-h';
      strip.style.top = def.top + 'px';
      strip.style.animationDuration = def.dur + 's';
      strip.style.animationDelay = -(Math.random() * def.dur) + 's';

      repeated.forEach(txt => {
        const el = document.createElement('div');
        el.className = 'strip-sentence';
        el.textContent = txt;
        el.style.font = fontStr;
        el.style.color = color;
        strip.appendChild(el);
      });
      layer.appendChild(strip);

    } else if (def.dir === 'd') {
      const wrap = document.createElement('div');
      wrap.className = 'strip-d-wrap';
      wrap.style.top = def.top + 'px';
      wrap.style.transform = `rotate(${def.deg}deg)`;

      const strip = document.createElement('div');
      strip.className = 'strip-d';
      strip.style.animationDuration = def.dur + 's';
      strip.style.animationDelay = -(Math.random() * def.dur) + 's';

      repeated.forEach(txt => {
        const el = document.createElement('div');
        el.className = 'strip-sentence';
        el.textContent = txt;
        el.style.font = fontStr;
        el.style.color = color;
        strip.appendChild(el);
      });
      wrap.appendChild(strip);
      layer.appendChild(wrap);
    }
  });
}

// 从数组随机取n个（有放回）
function pick(arr, n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(arr[Math.floor(Math.random() * arr.length)]);
  return out;
}

// ═══════════════════════════════════════════════════════
// FONT LOAD + UI READY
// ═══════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  try {
    await document.fonts.load('12px "Noto Serif SC"');
    document.getElementById('loading-msg').innerHTML =
      '语言漂浮在我们之间。<br>Language drifts between us.<br>Les langues dérivent entre nous.';
  } catch(e) {}
  document.getElementById('start-btn').style.display = 'block';
  document.getElementById('swipe-hint').style.display = 'block';
});

// ═══════════════════════════════════════════════════════
// THREE.JS — 单字飘动层
// ═══════════════════════════════════════════════════════
const N_ELEMENTS = 160;
const SPREAD = 12, SPEED = 0.22, BOB_HZ = 0.18, BOB_AMT = 0.10, ROT_MAX = 0.010;
let renderer, scene, camera, clock, meshes = [];
let dragYaw = 0, dragPitch = 0, pointerDown = false, lastPX = 0, lastPY = 0;

function makeTexture(tagged) {
  const { text, lang } = tagged;
  const cfg = LANG_CONFIG[lang];
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');

  const logicalSize = 32 + Math.floor(Math.random() * 24); // 单字/词：32–56px逻辑
  const physSize = Math.round(logicalSize * DPR);
  const fontTpl = cfg.fonts[Math.floor(Math.random() * cfg.fonts.length)];
  const font = fontTpl.replace('{s}', physSize);

  ctx.font = font;
  const metrics = ctx.measureText(text);
  const tw = Math.ceil(metrics.width) + Math.ceil(physSize * 0.5);
  const th = Math.ceil(physSize * 1.5);
  c.width = Math.max(tw, 4);
  c.height = Math.max(th, 4);

  ctx.font = font; // canvas resize后必须重设
  ctx.fillStyle = cfg.colors[Math.floor(Math.random() * cfg.colors.length)];
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, c.height / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return { tex, ratio: c.height / c.width };
}

async function start() {
  document.getElementById('ui').style.display = 'none';

  // 先建strips（纯CSS，立刻可见）
  buildStrips();

  // 摄像头
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:'environment'} }, audio:false });
    document.getElementById('cam').srcObject = s;
  } catch(e) {}

  // Three.js
  const canvas = document.getElementById('three-canvas');
  renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setPixelRatio(DPR);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 6);
  clock  = new THREE.Clock();

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  // 触控
  const el = renderer.domElement;
  const onDown = e => { pointerDown=true; const p=e.touches?e.touches[0]:e; lastPX=p.clientX; lastPY=p.clientY; };
  const onMove = e => {
    if (!pointerDown) return;
    const p = e.touches?e.touches[0]:e;
    dragYaw   -= (p.clientX - lastPX) * 0.004;
    dragPitch -= (p.clientY - lastPY) * 0.002;
    dragPitch  = Math.max(-0.5, Math.min(0.5, dragPitch));
    lastPX = p.clientX; lastPY = p.clientY;
  };
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('touchstart',  onDown, { passive:true });
  window.addEventListener('pointerup',     () => pointerDown=false);
  window.addEventListener('pointercancel', () => pointerDown=false);
  window.addEventListener('touchend',      () => pointerDown=false);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('touchmove',   onMove, { passive:true });

  // 等字体ready再spawn（防中文fallback到黑体）
  await document.fonts.ready;

  for (let i = 0; i < N_ELEMENTS; i++) {
    const tagged = TEXTS_TAGGED[i % TEXTS_TAGGED.length];
    const { tex, ratio } = makeTexture(tagged);

    const sizeVar = 0.4 + Math.random() * 0.9;
    const w = sizeVar * 1.4, h = w * ratio;

    const geo = new THREE.PlaneGeometry(w, h);
    const baseOpacity = 0.45 + Math.random() * 0.45;
    const mat = new THREE.MeshBasicMaterial({
      map:tex, transparent:true, depthWrite:false, side:THREE.DoubleSide, opacity:baseOpacity,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = Math.random();

    mesh.position.set(
      (Math.random()-0.5)*SPREAD*2,
      (Math.random()-0.5)*SPREAD,
      (Math.random()-0.5)*SPREAD*1.8
    );
    mesh.rotation.set(
      (Math.random()-0.5)*Math.PI*0.5,
      (Math.random()-0.5)*Math.PI*0.7,
      (Math.random()-0.5)*Math.PI*0.3
    );

    const angle = Math.random()*Math.PI*2;
    const spd   = SPEED * (0.4 + Math.random()*0.9);
    mesh.userData = {
      vx: Math.cos(angle)*spd, vz: (Math.random()-0.5)*spd*0.2,
      rx: (Math.random()-0.5)*2*ROT_MAX,
      ry: (Math.random()-0.5)*2*ROT_MAX*1.5,
      rz: (Math.random()-0.5)*2*ROT_MAX*0.6,
      bobPhase: Math.random()*Math.PI*2,
      bobRate:  0.6+Math.random()*0.8,
      baseY: mesh.position.y,
      wobblePhase: Math.random()*Math.PI*2,
      wobbleAmt:   (Math.random()-0.5)*0.06,
      baseOpacity,
    };

    scene.add(mesh);
    meshes.push(mesh);
  }

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();
  const H  = SPREAD;

  meshes.forEach(m => {
    const d = m.userData;
    const wobble = Math.sin(t*0.4 + d.wobblePhase) * d.wobbleAmt;
    m.position.x += (d.vx + wobble) * dt;
    m.position.y  = d.baseY + Math.sin(t*BOB_HZ*d.bobRate*Math.PI*2 + d.bobPhase)*BOB_AMT;
    m.position.z += d.vz * dt;
    m.rotation.x += d.rx * dt * 60;
    m.rotation.y += d.ry * dt * 60;
    m.rotation.z += d.rz * dt * 60;

    const lim = H*2;
    if (m.position.x >  lim) { m.position.x=-lim; d.baseY=(Math.random()-0.5)*H; }
    if (m.position.x < -lim) { m.position.x= lim; d.baseY=(Math.random()-0.5)*H; }
    if (m.position.z >  H*2) m.position.z = -H*2;
    if (m.position.z < -H*2) m.position.z =  H*2;

    const depth = (m.position.z + H*1.5) / (H*3.0);
    m.material.opacity = Math.max(0.08, Math.min(0.92, d.baseOpacity*(0.3+depth*0.7)));
  });

  camera.rotation.y += (dragYaw   - camera.rotation.y) * 0.08;
  camera.rotation.x += (dragPitch - camera.rotation.x) * 0.08;
  renderer.render(scene, camera);
}
</script>
</body>
</html>
